claim: >-
  At the reviewed commit, the repository implements a local configured-subsystem
  quorum that rejects unknown or non-causal vote replacement, treats missing,
  stale, future, and abstaining votes as incomplete, escalates qualifying
  high-severity NO_GO votes to a local hold, and generates SHA-256-bound
  receipts over vote views, policy, time, and state. Repository-owned tests
  encode these freshness, aggregation, replacement, and receipt expectations.
