  repository_url: https://github.com/GlacierEQ/spacex-hold-reason-compiler
  inspected_paths:
    - README.md
    - src/hold_compiler.py
    - tests/test_hold_compiler.py
  review_method: >-
    Static source and behavioral-contract review at the recorded commit; this
    review does not assert that repository tests were executed during recovery.
claim: >-
  At the reviewed commit, the repository implements a local deterministic
  compiler for caller-supplied hold residuals. It validates residual fields,
  retains the highest severity for matching subsystem/code pairs, merges tied
  details in sorted order, applies a local severity/priority order, and emits
  structured brief fields with policy and result fingerprints. Repository-owned
  tests encode these local ordering, validation, and stability expectations.
known_limit: >-
  The artifact does not authenticate residual sources, determine real safety,
  clear a hold, issue go/no-go authority, command hardware, describe an
  external operating procedure, or establish any relationship with SpaceX.
  Owner labels and priorities are local policy fixtures.
evidence_boundary: >-
  Local explanation of supplied residuals only; no authority over an
  operational hold or flight decision.
