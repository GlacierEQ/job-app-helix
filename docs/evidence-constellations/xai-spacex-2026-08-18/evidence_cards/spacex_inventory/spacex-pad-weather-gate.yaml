claim: >-
  At the reviewed commit, the repository implements a local evaluator for
  caller-supplied synthetic wind, shear, lightning distance, cloud ceiling, and
  visibility values. It rejects non-finite and negative inputs, evaluates five
  illustrative constraints in fixed order, returns PASS or BLOCK, and emits a
  bounded minimum-margin fixture metric with a named evidence state.
  Repository-owned tests encode these local mechanics and the non-authority
  public boundary.
