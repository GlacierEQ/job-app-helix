claim: >-
  At the reviewed commit, the repository implements a local monotonic lifecycle
  around a caller-supplied effector. It binds an intent identifier to one action,
  validates non-empty boolean preconditions, records hash-linked events, refuses
  failed preconditions, treats unavailable effect results or required
  postconditions as UNVERIFIED rather than falsely refused, and rejects illegal
  transitions. Repository-owned tests encode lifecycle, idempotence, uncertainty,
  receipt-chain, and caller-mutation-isolation expectations.
known_limit: >-
  The artifact does not authorize external actuation, authenticate actors or
  effectors, prove physical side effects beyond supplied evidence, prevent
  replay at an external actuator, establish hardware or facility control, or
  establish any relationship with xAI. The claim-promotion-fence relationship
  is not an exercised integration.
evidence_boundary: >-
  Local lifecycle receipts around a supplied effector only; no external control
  authority or physical-effect proof.
