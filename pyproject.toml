[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-app-helix"
version = "0.1.0"
description = "Proof-driven public runtime for the GlacierEQ Job-App Helix"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary portfolio demonstration" }
authors = [{ name = "Casey Barton" }]
dependencies = []

[project.scripts]
job-app-helix = "helix.public_runtime:main"

[tool.setuptools.packages.find]
include = ["helix*"]
