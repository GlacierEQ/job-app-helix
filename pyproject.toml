[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "job-app-helix"
version = "0.3.0"
description = "Evidence-bound job application outcome engine and portfolio intelligence system."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Casey Barton" }]
keywords = ["job-applications", "portfolio", "systems-engineering", "evidence", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "protobuf>=6.31,<7",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.74,<2",
  "mypy>=1.13,<2",
  "pytest>=9.1.1,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
job-app-helix = "job_app_helix.cli:main"
job-app-helix-readme = "job_app_helix.readme_mesh_cli:main"
job-app-helix-portfolio = "job_app_helix.portfolio_cli:main"
job-app-helix-productize = "job_app_helix.productization_cli:main"
job-app-helix-library = "job_app_helix.library_cli:main"
job-app-helix-genius = "job_app_helix.genius_engine:main"
job-app-helix-restore = "job_app_helix.restoration_cli:main"
job-app-helix-prioritize = "job_app_helix.restoration_workforce_cli:main"
job-app-helix-opportunity = "job_app_helix.opportunity_intelligence:main"
job-app-helix-strategy = "job_app_helix.application_strategy:main"
job-app-helix-queue = "job_app_helix.opportunity_queue:main"
job-app-helix-batch = "job_app_helix.batch_application_execution:main"
job-app-helix-freshness-batch = "job_app_helix.freshness_aware_batch:main"
job-app-helix-cycle = "job_app_helix.intelligence_cycle:main"
job-app-helix-watch-cycle = "job_app_helix.opening_watch_cycle:main"
job-app-helix-discover-openings = "job_app_helix.target_opening_discovery:main"
job-app-helix-target-cycle = "job_app_helix.target_intelligence_cycle:main"
job-app-helix-target-application = "job_app_helix.target_application_cycle:main"
job-app-helix-application-evidence = "job_app_helix.application_evidence_graph:main"
job-app-helix-greenhouse-fields = "job_app_helix.greenhouse_application_fields:main"
job-app-helix-greenhouse-prepare = "job_app_helix.greenhouse_application_preparation:main"
job-app-helix-greenhouse-finalize = "job_app_helix.greenhouse_application_finalization:main"
job-app-helix-greenhouse-submit = "job_app_helix.greenhouse_submission_execution:main"
job-app-helix-profile = "job_app_helix.candidate_profile_compiler:main"
job-app-helix-estate-recovery = "job_app_helix.estate_recovery_census:main"
job-app-helix-estate-restore = "job_app_helix.estate_federated_restoration:main"
job-app-helix-estate-compose = "job_app_helix.estate_federated_recovery:main"
job-app-helix-company-refresh = "job_app_helix.company_intelligence_refresh:main"
job-app-helix-company-acquire = "job_app_helix.company_intelligence_acquisition:main"
job-app-helix-outcomes = "job_app_helix.outcome_calibration:main"
job-app-helix-recover = "job_app_helix.intelligent_recovery_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_app_helix"]

[tool.hatch.build.targets.wheel.force-include]
"manifests" = "job_app_helix/_library_manifests"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/job_app_helix/readme_mesh_pb2.py"]

[tool.ruff.lint.isort]
known-first-party = ["job_app_helix"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["ʻ"]

[[tool.mypy.overrides]]
module = "job_app_helix.readme_mesh_pb2"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["job_app_helix.readme_mesh_manifest", "job_app_helix.readme_mesh"]
ignore_errors = true

[tool.ruff.lint.per-file-ignores]
"apex_highway.py" = ["E501"]
"apex_distributed_compute.py" = ["E501"]
"ci_audit_portfolio.py" = ["E501"]
"generate_outreach_dms.py" = ["E501"]
"test_apex_distributed_compute.py" = ["E501"]
"showcase/demo_15min_run.py" = ["E501"]
"helix/**/*.py" = ["E501"]
"src/job_app_helix/genius_engine.py" = ["E501", "F401"]
"src/job_app_helix/portfolio_execution.py" = ["E501"]
# Source remains narrowly linted; only the test is masked for one binary proof build.
"src/job_app_helix/greenhouse_submission_execution.py" = ["E501", "UP038"]
"tests/test_greenhouse_submission_execution.py" = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
"src/job_app_helix/innovation_engine.py" = ["SIM108"]
# Pre-existing style debt discovered on 2026-08-10. These files are explicitly
# quarantined from unrelated style-only failures while the authority repair is verified.
"scripts/audit_live_portfolio_freshness.py" = ["E402", "I001", "UP017"]
"scripts/migrate_to_excellence_record.py" = ["E402", "E501", "I001", "UP015"]
"tests/test_final_form_package.py" = ["I001"]
"scripts/validate_application_registry.py" = ["B905"]
"scripts/run_featured_verification.py" = ["E402", "I001", "UP017"]
"scripts/cleanup_obsolete_branches.py" = ["E501", "I001"]
"scripts/census_public_portfolio.py" = ["E402", "I001", "UP017"]
"src/job_app_helix/portfolio_models.py" = ["I001", "UP042"]
"src/job_app_helix/library_cli.py" = ["E402", "I001", "UP017"]
"src/job_app_helix/estate_compiler.py" = ["I001", "UP042"]
# Pre-existing style debt - line length violations
"scripts/discover_experience_graph.py" = ["E501"]
"src/job_app_helix/intelligent_recovery.py" = ["E501"]
"src/job_app_helix/library_program.py" = ["E501"]
"src/job_app_helix/public_proof_runtime.py" = ["E501"]
"src/job_app_helix/recovery_reconnaissance.py" = ["E501"]
"src/job_app_helix/repo_excellence.py" = ["E501"]
"tests/test_company_intelligence.py" = ["E501"]
"tests/test_experience_graph_discovery.py" = ["E501"]
"tests/test_intelligent_recovery.py" = ["E501"]
"tests/test_library_program.py" = ["E501"]
"tests/test_opportunity_queue.py" = ["E501"]
"tests/test_repo_excellence.py" = ["E501"]
