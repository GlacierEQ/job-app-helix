name: Deploy recruiter presentation

on:
  push:
    branches: [main]
    paths:
      - "hire_package/casey-barton/**"
      - "site/**"
      - "scripts/build_recruiter_site.py"
      - "scripts/build_compiled_recruiter_site.py"
      - "scripts/compile_estate_graph.py"
      - "scripts/project_estate_intelligence.py"
      - "src/job_app_helix/estate_compiler.py"
      - "src/job_app_helix/estate_intelligence*.py"
      - "src/job_app_helix/company_intelligence.py"
      - "manifests/estate_compiler.json"
      - "manifests/estate_projection_policy.json"
      - "manifests/estate_facts.json"
      - "manifests/application_intelligence/**"
      - "manifests/company_dossiers.json"
      - "manifests/company_dossiers/**"
      - "manifests/flagship_registry.json"
      - "tests/test_recruiter_site_deployment.py"
      - "tests/test_estate_compiler.py"
      - "tests/test_estate_intelligence.py"
      - "tests/test_compiled_recruiter_site.py"
      - "RECRUITER_EXECUTIVE_SUMMARY.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "hire_package/casey-barton/**"
      - "site/**"
      - "scripts/build_recruiter_site.py"
      - "scripts/build_compiled_recruiter_site.py"
      - "scripts/compile_estate_graph.py"
      - "scripts/project_estate_intelligence.py"
      - "src/job_app_helix/estate_compiler.py"
      - "src/job_app_helix/estate_intelligence*.py"
      - "src/job_app_helix/company_intelligence.py"
      - "manifests/estate_compiler.json"
      - "manifests/estate_projection_policy.json"
      - "manifests/estate_facts.json"
      - "manifests/application_intelligence/**"
      - "manifests/company_dossiers.json"
      - "manifests/company_dossiers/**"
      - "manifests/flagship_registry.json"
      - "tests/test_recruiter_site_deployment.py"
      - "tests/test_estate_compiler.py"
      - "tests/test_estate_intelligence.py"
      - "tests/test_compiled_recruiter_site.py"
      - "RECRUITER_EXECUTIVE_SUMMARY.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recruiter-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build evidence-bound site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and verification tools
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"

      - name: Run recruiter and compiler contract tests
        run: >-
          python -m pytest -q
          tests/test_recruiter_site_deployment.py
          tests/test_estate_compiler.py
          tests/test_estate_intelligence.py
          tests/test_compiled_recruiter_site.py

      - name: Detect live estate census authority
        id: estate-auth
        if: github.event_name != 'pull_request'
        env:
          ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          if [ -n "${ESTATE_TOKEN:-}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "Live private-estate projection unavailable; deploying static boundary."
          fi

      - name: Build pull-request static boundary
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/build_compiled_recruiter_site.py
          --output artifacts/pages-site
          --source-commit "${{ github.sha }}"

      - name: Census live owner estate
        if: >-
          github.event_name != 'pull_request' &&
          steps.estate-auth.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        run: >-
          python scripts/census_owned_library.py
          --token "${GITHUB_TOKEN}"
          --output /tmp/owned-library-census.json

      - name: Compile canonical estate bundle
        if: >-
          github.event_name != 'pull_request' &&
          steps.estate-auth.outputs.available == 'true'
        run: >-
          python scripts/compile_estate_graph.py
          --census /tmp/owned-library-census.json
          --estate-facts manifests/estate_facts.json
          --output-dir /tmp/estate-compiler

      - name: Project public estate intelligence
        if: >-
          github.event_name != 'pull_request' &&
          steps.estate-auth.outputs.available == 'true'
        run: >-
          python scripts/project_estate_intelligence.py
          --bundle /tmp/estate-compiler/estate-compiler-bundle.json
          --census /tmp/owned-library-census.json
          --estate-facts manifests/estate_facts.json
          --output /tmp/estate-compiler/estate-intelligence-bundle.json
          --public-output /tmp/estate-compiler/public-safe-company-projection-v2.json

      - name: Build canonical compiled recruiter surface
        if: >-
          github.event_name != 'pull_request' &&
          steps.estate-auth.outputs.available == 'true'
        run: >-
          python scripts/build_compiled_recruiter_site.py
          --output artifacts/pages-site
          --source-commit "${{ github.sha }}"
          --public-projection /tmp/estate-compiler/public-safe-company-projection-v2.json

      - name: Build static fallback without private census authority
        if: >-
          github.event_name != 'pull_request' &&
          steps.estate-auth.outputs.available != 'true'
        run: >-
          python scripts/build_compiled_recruiter_site.py
          --output artifacts/pages-site
          --source-commit "${{ github.sha }}"

      - name: Verify no private compiler inputs entered Pages artifact
        run: |
          set -euo pipefail
          test ! -e artifacts/pages-site/owned-library-census.json
          test ! -e artifacts/pages-site/canonical-system-registry.json
          test ! -e artifacts/pages-site/capability-donor-registry.json
          test ! -e artifacts/pages-site/company-projection-registry.json
          test ! -e artifacts/pages-site/estate-intelligence-bundle.json
          if [ "${{ steps.estate-auth.outputs.available }}" = "true" ]; then
            test -s artifacts/pages-site/estate-projection.json
          fi

      - name: Verify public repository boundary
        run: python scripts/check_public_surface.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages-site

      - name: Upload deployment manifest for review
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-pages-manifest-${{ github.sha }}
          path: artifacts/pages-site/deployment-manifest.json
          if-no-files-found: error

  deploy:
    name: Deploy canonical main
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Probe GitHub Pages readiness
        id: pages-ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(
            curl --silent --show-error \
              --output /tmp/pages.json \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          )"
          case "${status}" in
            200)
              echo "available=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "available=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::GitHub Pages is not enabled for this repository."
              ;;
            *)
              cat /tmp/pages.json >&2 || true
              echo "Unexpected GitHub Pages probe status: ${status}" >&2
              exit 1
              ;;
          esac

      - name: Detect Pages bootstrap authority
        id: pages-bootstrap
        env:
          PAGES_TOKEN: ${{ secrets.GLACIEREQ_PAGES_TOKEN }}
        shell: bash
        run: |
          if [ -n "${PAGES_TOKEN:-}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure existing GitHub Pages
        if: steps.pages-ready.outputs.available == 'true'
        uses: actions/configure-pages@v6

      - name: Enable and configure GitHub Pages
        if: >-
          steps.pages-ready.outputs.available != 'true' &&
          steps.pages-bootstrap.outputs.available == 'true'
        uses: actions/configure-pages@v6
        with:
          enablement: true
          token: ${{ secrets.GLACIEREQ_PAGES_TOKEN }}

      - name: Deploy recruiter presentation
        id: deployment
        if: >-
          steps.pages-ready.outputs.available == 'true' ||
          steps.pages-bootstrap.outputs.available == 'true'
        uses: actions/deploy-pages@v4

      - name: Record Pages enablement gate
        if: >-
          steps.pages-ready.outputs.available != 'true' &&
          steps.pages-bootstrap.outputs.available != 'true'
        shell: bash
        run: |
          {
            echo "### Recruiter deployment gate"
            echo
            echo "The recruiter artifact was built and privacy-verified, but GitHub Pages is disabled."
            echo "No deployment was attempted."
            echo
            echo "To permit automatic bootstrap, configure GLACIEREQ_PAGES_TOKEN with"
            echo "repository administration/write and Pages/write authority."
          } >> "${GITHUB_STEP_SUMMARY}"
