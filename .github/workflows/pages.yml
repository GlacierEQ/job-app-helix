name: Deploy recruiter presentation

on:
  push:
    branches: [main]
    paths:
      - "hire_package/casey-barton/**"
      - "site/**"
      - "scripts/build_recruiter_site.py"
      - "scripts/build_compiled_recruiter_site.py"
      - "scripts/compile_estate_graph.py"
      - "scripts/project_estate_intelligence.py"
      - "src/job_app_helix/estate_compiler.py"
      - "src/job_app_helix/estate_intelligence.py"
      - "src/job_app_helix/company_intelligence.py"
      - "manifests/estate_compiler.json"
      - "manifests/estate_projection_policy.json"
      - "manifests/estate_facts.json"
      - "manifests/application_intelligence/**"
      - "manifests/company_dossiers.json"
      - "manifests/company_dossiers/**"
      - "manifests/flagship_registry.json"
      - "tests/test_recruiter_site_deployment.py"
      - "tests/test_estate_compiler.py"
      - "tests/test_estate_intelligence.py"
      - "tests/test_compiled_recruiter_site.py"
      - "RECRUITER_EXECUTIVE_SUMMARY.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "hire_package/casey-barton/**"
      - "site/**"
      - "scripts/build_recruiter_site.py"
      - "scripts/build_compiled_recruiter_site.py"
      - "scripts/compile_estate_graph.py"
      - "scripts/project_estate_intelligence.py"
      - "src/job_app_helix/estate_compiler.py"
      - "src/job_app_helix/estate_intelligence.py"
      - "src/job_app_helix/company_intelligence.py"
      - "manifests/estate_compiler.json"
      - "manifests/estate_projection_policy.json"
      - "manifests/estate_facts.json"
      - "manifests/application_intelligence/**"
      - "manifests/company_dossiers.json"
      - "manifests/company_dossiers/**"
      - "manifests/flagship_registry.json"
      - "tests/test_recruiter_site_deployment.py"
      - "tests/test_estate_compiler.py"
      - "tests/test_estate_intelligence.py"
      - "tests/test_compiled_recruiter_site.py"
      - "RECRUITER_EXECUTIVE_SUMMARY.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recruiter-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build evidence-bound site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and verification tools
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"

      - name: Run recruiter and compiler contract tests
        run: >-
          python -m pytest -q
          tests/test_recruiter_site_deployment.py
          tests/test_estate_compiler.py
          tests/test_estate_intelligence.py
          tests/test_compiled_recruiter_site.py

      - name: Build pull-request static boundary
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/build_compiled_recruiter_site.py
          --output artifacts/pages-site
          --source-commit "${{ github.sha }}"

      - name: Require live census authority
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        run: |
          test -n "${GITHUB_TOKEN}" || {
            echo "GLACIEREQ_ESTATE_TOKEN is required to compile the live estate" >&2
            exit 1
          }

      - name: Census live owner estate
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        run: >-
          python scripts/census_owned_library.py
          --token "${GITHUB_TOKEN}"
          --output /tmp/owned-library-census.json

      - name: Compile canonical estate bundle
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/compile_estate_graph.py
          --census /tmp/owned-library-census.json
          --estate-facts manifests/estate_facts.json
          --output-dir /tmp/estate-compiler

      - name: Project public estate intelligence
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/project_estate_intelligence.py
          --bundle /tmp/estate-compiler/estate-compiler-bundle.json
          --census /tmp/owned-library-census.json
          --estate-facts manifests/estate_facts.json
          --output /tmp/estate-compiler/estate-intelligence-bundle.json
          --public-output /tmp/estate-compiler/public-safe-company-projection-v2.json

      - name: Build canonical compiled recruiter surface
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/build_compiled_recruiter_site.py
          --output artifacts/pages-site
          --source-commit "${{ github.sha }}"
          --public-projection /tmp/estate-compiler/public-safe-company-projection-v2.json

      - name: Verify no private compiler inputs entered Pages artifact
        run: |
          set -euo pipefail
          test ! -e artifacts/pages-site/owned-library-census.json
          test ! -e artifacts/pages-site/canonical-system-registry.json
          test ! -e artifacts/pages-site/capability-donor-registry.json
          test ! -e artifacts/pages-site/company-projection-registry.json
          test ! -e artifacts/pages-site/estate-intelligence-bundle.json
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            test -s artifacts/pages-site/estate-projection.json
          fi

      - name: Verify public repository boundary
        run: python scripts/check_public_surface.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages-site

      - name: Upload deployment manifest for review
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-pages-manifest-${{ github.sha }}
          path: artifacts/pages-site/deployment-manifest.json
          if-no-files-found: error

  deploy:
    name: Deploy canonical main
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy recruiter presentation
        id: deployment
        uses: actions/deploy-pages@v4
