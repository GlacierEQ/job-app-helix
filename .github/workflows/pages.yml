name: Deploy recruiter presentation

on:
  push:
    branches: [main]
    paths:
      - "hire_package/casey-barton/**"
      - "site/**"
      - "scripts/build_recruiter_site.py"
      - "scripts/build_compiled_recruiter_site.py"
      - "scripts/compile_estate_projection.py"
      - "scripts/estate_compiler/**"
      - "policies/estate_intelligence_compiler.json"
      - "manifests/estate_lineage_assertions.json"
      - "manifests/application_intelligence/**"
      - "manifests/company_dossiers.json"
      - "manifests/company_dossiers/**"
      - "manifests/company_second_depth.json"
      - "manifests/flagship_registry.json"
      - "status/repository-assessments/**"
      - "tests/test_recruiter_site_deployment.py"
      - "tests/test_compiled_recruiter_site.py"
      - "tests/test_estate_projection_compiler.py"
      - "tests/test_estate_role_intelligence.py"
      - "RECRUITER_EXECUTIVE_SUMMARY.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "hire_package/casey-barton/**"
      - "site/**"
      - "scripts/build_recruiter_site.py"
      - "scripts/build_compiled_recruiter_site.py"
      - "scripts/compile_estate_projection.py"
      - "scripts/estate_compiler/**"
      - "policies/estate_intelligence_compiler.json"
      - "manifests/estate_lineage_assertions.json"
      - "manifests/application_intelligence/**"
      - "manifests/company_dossiers.json"
      - "manifests/company_dossiers/**"
      - "manifests/company_second_depth.json"
      - "manifests/flagship_registry.json"
      - "status/repository-assessments/**"
      - "tests/test_recruiter_site_deployment.py"
      - "tests/test_compiled_recruiter_site.py"
      - "tests/test_estate_projection_compiler.py"
      - "tests/test_estate_role_intelligence.py"
      - "RECRUITER_EXECUTIVE_SUMMARY.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recruiter-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build evidence-bound site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OWNER_CENSUS_TOKEN: ${{ secrets.OWNER_CENSUS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and verification tools
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"

      - name: Run recruiter and compiler contract tests
        run: >-
          python -m pytest -q
          tests/test_recruiter_site_deployment.py
          tests/test_compiled_recruiter_site.py
          tests/test_estate_projection_compiler.py
          tests/test_estate_role_intelligence.py

      - name: Build pull-request static boundary
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/build_compiled_recruiter_site.py
          --output artifacts/pages-site
          --source-commit "${{ github.sha }}"

      - name: Require live census authority
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OWNER_CENSUS_TOKEN:-}" ]; then
            echo "OWNER_CENSUS_TOKEN is required to compile the live estate."
            exit 1
          fi

      - name: Census live owner estate
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/census_owned_library.py
          --owner GlacierEQ
          --token "$OWNER_CENSUS_TOKEN"
          --output /tmp/owned-library-census.json

      - name: Compile live public projection
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/compile_estate_projection.py
          --census /tmp/owned-library-census.json
          --output /tmp/estate-intelligence

      - name: Build canonical compiled recruiter surface
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/build_compiled_recruiter_site.py
          --output artifacts/pages-site
          --source-commit "${{ github.sha }}"
          --public-projection /tmp/estate-intelligence/public_projection.json

      - name: Verify no private compiler inputs entered Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test ! -e artifacts/pages-site/owned-library-census.json
          test ! -e artifacts/pages-site/canonical_system_registry.json
          test ! -e artifacts/pages-site/capability_donor_registry.json
          test ! -e artifacts/pages-site/company_projection_registry.json
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            test -s artifacts/pages-site/estate-projection.json
          fi

      - name: Verify public repository boundary
        run: python scripts/check_public_surface.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages-site

      - name: Upload deployment manifest for review
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-pages-manifest-${{ github.sha }}
          path: artifacts/pages-site/deployment-manifest.json
          if-no-files-found: error

  deploy:
    name: Deploy canonical main
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy recruiter presentation
        id: deployment
        uses: actions/deploy-pages@v4
