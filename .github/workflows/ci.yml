name: Public proof

on:
  push:
    branches:
      - main
      - "cleanup/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile public runtime
        run: python -m compileall helix tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate nominal proof receipt
        run: |
          mkdir -p artifacts
          python -m helix.public_runtime demo --scenario nominal --output artifacts/public-proof.json
      - name: Verify recoverable loop
        run: python -m helix.public_runtime demo --scenario recoverable
      - name: Verify terminal fault fails closed
        run: |
          if python -m helix.public_runtime demo --scenario terminal; then
            echo "terminal scenario unexpectedly returned success" >&2
            exit 1
          fi
      - name: Audit public repository surface
        run: python tools/public_surface_audit.py
      - name: Upload proof receipt
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: public-proof-receipt
          path: artifacts/public-proof.json
          if-no-files-found: error
