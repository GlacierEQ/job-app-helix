name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint public source and audit runners
        run: >-
          ruff check src tests scripts showcase/demo_15min_run.py
          --output-format=github

      - name: Run tests
        run: pytest

      - name: Validate exact portfolio rollout contract
        run: python -m job_app_helix.portfolio_cli validate

      - name: Render high-level portfolio rollout program
        run: >-
          python -m job_app_helix.portfolio_cli render-program
          --output artifacts/portfolio-rollout.md

      - name: Compile and compare the real Protobuf contract
        run: python scripts/check_proto_contract.py

      - name: Validate README intelligence mesh
        run: python -m job_app_helix.readme_mesh_cli validate

      - name: Build binary, ProtoJSON, textproto, and hash artifacts
        run: python -m job_app_helix.readme_mesh_cli build --output-dir artifacts/readme-mesh

      - name: Render all repository README blocks
        run: python -m job_app_helix.readme_mesh_cli render-all --output-dir artifacts/readme-mesh/blocks

      - name: Verify reference README and generated projection
        shell: bash
        run: |
          python -m job_app_helix.readme_mesh_cli render GlacierEQ/job-app-helix \
            --output /tmp/README.generated-block.md
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          block = Path("/tmp/README.generated-block.md").read_text(encoding="utf-8")

          ordered_headings = [
              "## For recruiters and non-technical reviewers",
              "## For senior engineers and domain experts",
              "## For AI systems and toolchains",
          ]
          positions = [readme.index(heading) for heading in ordered_headings]
          if positions != sorted(positions):
              raise SystemExit("reference README audience layers are out of order")

          required_readme_contract = [
              "schema: glaciereq.readme.v1",
              "profile: glaciereq.readme-impact.v2-draft",
              "manifests/language_fit.json",
              "blocked_scope:",
              "unverified_scope:",
              "relationships:",
              "limits:",
          ]
          missing = [value for value in required_readme_contract if value not in readme]
          if missing:
              raise SystemExit(f"reference README contract missing: {missing}")

          required_projection = [
              "<!-- README-MESH:BEGIN -->",
              "### For recruiters and non-specialists",
              "### For senior engineers and domain experts",
              "### For AI systems and toolchains",
              "<!-- README-MESH:END -->",
          ]
          missing_projection = [value for value in required_projection if value not in block]
          if missing_projection:
              raise SystemExit(f"generated README projection missing: {missing_projection}")
          PY

      - name: Run nominal campaign
        run: python -m job_app_helix nominal --output artifacts/nominal.json

      - name: Run recoverable campaign
        run: python -m job_app_helix recoverable --output artifacts/recoverable.json

      - name: Verify hard failure remains fail-closed
        shell: bash
        run: |
          set +e
          python -m job_app_helix hard-no-go --json > artifacts/hard-no-go.json
          status=$?
          set -e
          test "$status" -eq 1

      - name: Verify public repository boundary
        run: python scripts/check_public_surface.py

      - name: Upload proof receipts and README Mesh artifacts
        if: ${{ always() && hashFiles('artifacts/**/*') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helix-proofs-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: ignore
