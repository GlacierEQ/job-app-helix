name: SmartRecruiters Target Discovery Proof

on:
  pull_request:
    paths:
      - "src/job_app_helix/smartrecruiters_opening_discovery.py"
      - "src/job_app_helix/target_opening_discovery.py"
      - "tests/test_smartrecruiters_target_discovery.py"
      - "tests/test_target_opening_discovery.py"
      - ".github/workflows/smartrecruiters-target-discovery-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: SmartRecruiters target discovery / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and proof tools
        run: python -m pip install -e ".[dev]"
      - name: Lint SmartRecruiters target surface
        run: >-
          ruff check
          src/job_app_helix/smartrecruiters_opening_discovery.py
          src/job_app_helix/target_opening_discovery.py
          tests/test_smartrecruiters_target_discovery.py
          tests/test_target_opening_discovery.py
      - name: Run SmartRecruiters adversarial and target regression tests
        run: >-
          pytest -q
          tests/test_smartrecruiters_target_discovery.py
          tests/test_target_opening_discovery.py
      - name: Prove installed target discovery executable
        run: job-app-helix-discover-openings --help
