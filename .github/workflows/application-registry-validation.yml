name: Application Registry Validation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          check-latest: false
      - name: Validate exact application coverage
        run: python scripts/validate_application_registry.py
      - name: Validate base company second-depth progression
        run: python scripts/validate_company_second_depth.py
      - name: Validate effective modular company second-depth progression
        run: python scripts/validate_company_second_depth_effective.py
      - name: Run registry regression tests
        run: |
          python -m unittest tests.test_application_registry -v
          python -m unittest tests.test_company_second_depth -v
      - name: Parse every governing JSON artifact
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          paths = [
              Path('manifests/company_dossiers.json'),
              Path('manifests/company_second_depth.json'),
              Path('manifests/flagship_registry.json'),
              Path('manifests/flagship_external_repositories.json'),
              Path('manifests/portfolio_repositories.json'),
              *sorted(Path('manifests/company_dossiers').glob('*.json')),
              *sorted(Path('manifests/company_second_depth_overrides').glob('*.json')),
          ]
          for path in paths:
              try:
                  raw = path.read_text(encoding='utf-8')
                  json.loads(raw)
              except FileNotFoundError:
                  print(f'JSON FAIL: missing {path}', file=sys.stderr)
                  raise SystemExit(1)
              except json.JSONDecodeError as exc:
                  print(f'JSON FAIL: {path} - {exc}', file=sys.stderr)
                  raise SystemExit(1)
              print(f'JSON PASS: {path}')
          PY
