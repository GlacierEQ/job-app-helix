name: Application Registry Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/application-registry-validation.yml"
      - "manifests/company_dossiers.json"
      - "manifests/company_dossiers/**"
      - "manifests/flagship_registry.json"
      - "manifests/portfolio_repositories.json"
      - "scripts/validate_application_registry.py"
      - "tests/test_application_registry.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          check-latest: false
      - name: Validate exact application coverage
        run: python scripts/validate_application_registry.py
      - name: Run registry regression test
        run: python -m unittest tests.test_application_registry -v
      - name: Parse every governing JSON artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('manifests/company_dossiers.json'),
              Path('manifests/flagship_registry.json'),
              *sorted(Path('manifests/company_dossiers').glob('*.json')),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'JSON PASS: {path}')
          PY
