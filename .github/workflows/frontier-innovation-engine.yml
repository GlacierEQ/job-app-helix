name: Frontier Innovation Engine

on:
  pull_request:
    paths:
      - "docs/FRONTIER_REPOSITORY_INNOVATION_ENGINE.md"
      - "docs/GITHUB_AUTONOMOUS_EXECUTION_PROTOCOL.md"
      - "manifests/innovation_engine_policy.json"
      - "schemas/estate/**"
      - "src/job_app_helix/innovation_engine.py"
      - "scripts/frontier_innovation_engine.py"
      - "scripts/validate_innovation_engine.py"
      - "tests/test_innovation_engine*.py"
      - ".github/workflows/frontier-innovation-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate policy and schemas
        run: python scripts/validate_innovation_engine.py
      - name: Compile check
        run: python -m py_compile src/job_app_helix/innovation_engine.py scripts/frontier_innovation_engine.py scripts/validate_innovation_engine.py
      - name: Focused regression tests
        run: python -m pytest -q tests/test_innovation_engine*.py tests/test_estate_compiler.py
      - name: Static lint
        run: python -m ruff check src/job_app_helix/innovation_engine.py scripts/frontier_innovation_engine.py scripts/validate_innovation_engine.py tests/test_innovation_engine*.py
