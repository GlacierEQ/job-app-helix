name: Generate evidence lock artifacts

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/job_app_helix/live_evidence_adapter.py"
      - ".github/workflows/generate-evidence-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the same-repository PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6

      - name: Apply deterministic lint-only normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/job_app_helix/live_evidence_adapter.py')
          content = path.read_text(encoding='utf-8')
          content = content.replace(
              'from jsonschema.exceptions import SchemaError, ValidationError',
              'from jsonschema.exceptions import SchemaError',
          )
          content = content.replace(
              '        raise LiveEvidenceAdapterError(f"invalid repository observation schema: {exc.message}") from exc',
              '        raise LiveEvidenceAdapterError(\n'
              '            f"invalid repository observation schema: {exc.message}"\n'
              '        ) from exc',
          )
          path.write_text(content, encoding='utf-8')
          PY

      - name: Generate exact lock
        run: uv lock

      - name: Commit only the generated module and lock
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock src/job_app_helix/live_evidence_adapter.py
          if git diff --cached --quiet; then
            echo "Generated files already current"
          else
            git commit -m "build: refresh exact evidence dependency lock"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload generated files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-lock-generated-files
          path: |
            uv.lock
            src/job_app_helix/live_evidence_adapter.py
          if-no-files-found: error
