name: Company Intelligence Refresh Proof
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "src/job_app_helix/company_intelligence.py"
      - "src/job_app_helix/company_intelligence_refresh.py"
      - "tests/test_company_intelligence_refresh.py"
      - "pyproject.toml"
      - ".github/workflows/company-intelligence-refresh-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/job_app_helix/company_intelligence.py"
      - "src/job_app_helix/company_intelligence_refresh.py"
      - "tests/test_company_intelligence_refresh.py"
      - "pyproject.toml"
      - ".github/workflows/company-intelligence-refresh-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    name: Company refresh / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and proof tools
        run: python -m pip install -e ".[dev]"
      - name: Lint refresh surfaces
        run: >-
          ruff check
          src/job_app_helix/company_intelligence_refresh.py
          tests/test_company_intelligence_refresh.py
      - name: Run adversarial refresh tests
        run: python -m pytest -q tests/test_company_intelligence_refresh.py
      - name: Execute installed CLI refresh probe
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/company-refresh"
          mkdir -p "${work}"
          # Generate fresh, source-bound observations at execution time.
          # Static historical timestamps expired the evidence and broke the CLI proof.
          python - <<'PYDATA' "${work}"
          import json
          import pathlib
          import sys
          from datetime import UTC, datetime, timedelta

          root = pathlib.Path(sys.argv[1])
          now = datetime.now(UTC)
          previous = (now - timedelta(hours=2)).isoformat().replace("+00:00", "Z")
          incoming = (now - timedelta(hours=1)).isoformat().replace("+00:00", "Z")
          for name, timestamp, statement in (
              ("current", previous, "Build agent systems."),
              ("incoming", incoming, "Build agent systems with production observability."),
          ):
              payload = {
                  "company_id": "example",
                  "company": "Example",
                  "collected_at": timestamp,
                  "max_age_days": 30,
                  "signals": [{
                      "kind": "engineering",
                      "statement": statement,
                      "source_url": "https://example.com/engineering",
                      "observed_at": timestamp,
                  }],
              }
              (root / f"{name}.json").write_text(json.dumps(payload), encoding="utf-8")
          PYDATA
          job-app-helix-company-refresh \
            --current "${work}/current.json" \
            --incoming "${work}/incoming.json" \
            --output "${work}/active.json" \
            --history "${work}/history.jsonl" \
            --receipt "${work}/receipt.json"
          python - <<'PY' "${work}"
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          active = json.loads((root / "active.json").read_text())
          receipt = json.loads((root / "receipt.json").read_text())
          history = [json.loads(row) for row in (root / "history.jsonl").read_text().splitlines()]
          assert active["signals"][0]["statement"].endswith("production observability.")
          assert receipt["superseded_count"] == 1
          assert receipt["active_count"] == 1
          assert len(receipt["receipt_sha256"]) == 64
          assert history[0]["reason"] == "SUPERSEDED"
          print(json.dumps(receipt, sort_keys=True))
          PY
