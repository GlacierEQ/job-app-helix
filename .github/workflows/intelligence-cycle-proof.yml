name: Job Intelligence Cycle Proof

on:
  pull_request:
    paths:
      - "src/job_app_helix/intelligence_cycle.py"
      - "src/job_app_helix/opening_acquisition.py"
      - "tests/test_intelligence_cycle.py"
      - "tests/test_opening_acquisition.py"
      - "pyproject.toml"
      - ".github/workflows/intelligence-cycle-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/job_app_helix/intelligence_cycle.py"
      - "src/job_app_helix/opening_acquisition.py"
      - "tests/test_intelligence_cycle.py"
      - "tests/test_opening_acquisition.py"
      - "pyproject.toml"
      - ".github/workflows/intelligence-cycle-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    name: Intelligence cycle / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and proof tools
        run: python -m pip install -e ".[dev]"

      - name: Lint executable semantics
        run: >-
          ruff check --ignore E501
          src/job_app_helix/intelligence_cycle.py
          src/job_app_helix/opening_acquisition.py
          tests/test_intelligence_cycle.py
          tests/test_opening_acquisition.py

      - name: Run adversarial integrated cycle tests
        run: >-
          python -m pytest -q
          tests/test_intelligence_cycle.py
          tests/test_opening_acquisition.py

      - name: Prove installed executables
        run: |
          job-app-helix-cycle --help
          python -m job_app_helix.opening_acquisition --help
