name: Dynamic Opportunity Build Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "src/job_app_helix/dynamic_application_build.py"
      - "src/job_app_helix/application_engine.py"
      - "tests/test_dynamic_application_build.py"
      - "pyproject.toml"
      - ".github/workflows/dynamic-opportunity-build-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-build:
    name: "Dynamic build · Python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install runtime and test tools
        run: python -m pip install -e ".[dev]"

      - name: Lint dynamic build surface
        run: |
          ruff check             src/job_app_helix/dynamic_application_build.py             src/job_app_helix/application_engine.py             tests/test_dynamic_application_build.py

      - name: Prove dynamic opportunity build
        run: pytest -q tests/test_dynamic_application_build.py
