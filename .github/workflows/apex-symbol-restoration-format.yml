name: APEX Symbol Restoration Format

on:
  push:
    branches:
      - apex/symbol-restoration-ast-20260816
    paths:
      - ".github/workflows/apex-symbol-restoration-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: apex/symbol-restoration-ast-20260816
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.16.3"
      - name: Apply repository formatter and safe lint fixes
        run: |
          ruff check --fix src/job_app_helix/symbol_restoration.py src/job_app_helix/restoration_cli.py tests/test_symbol_restoration.py
          ruff format src/job_app_helix/symbol_restoration.py src/job_app_helix/restoration_cli.py tests/test_symbol_restoration.py
          ruff check src/job_app_helix/symbol_restoration.py src/job_app_helix/restoration_cli.py tests/test_symbol_restoration.py
      - name: Commit formatter delta
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "APEX Formatter"
          git config user.email "apex-formatter@users.noreply.github.com"
          git add src/job_app_helix/symbol_restoration.py src/job_app_helix/restoration_cli.py tests/test_symbol_restoration.py
          git commit -m "style: format symbol restoration implementation"
          git push origin HEAD:apex/symbol-restoration-ast-20260816
