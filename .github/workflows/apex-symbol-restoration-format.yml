name: APEX Symbol Restoration Format

on:
  push:
    branches:
      - apex/symbol-restoration-ast-20260816
    paths:
      - ".github/workflows/apex-symbol-restoration-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: apex/symbol-restoration-ast-20260816
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.16.3"
      - name: Apply targeted line fixes and repository formatter
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/job_app_helix/symbol_restoration.py")
          text = p.read_text()
          text = text.replace(
              '            raise RestorationError(f"target drift at {path}; symbol packet requires exact target file")',
              '            raise RestorationError(\n                f"target drift at {path}; symbol packet requires exact target file"\n            )',
          )
          text = text.replace(
              '                raise RestorationError(f"symbol missing during replacement: {action.qualified_name}")',
              '                raise RestorationError(\n                    f"symbol missing during replacement: {action.qualified_name}"\n                )',
          )
          p.write_text(text)

          p = Path("tests/test_symbol_restoration.py")
          text = p.read_text()
          text = text.replace(
              '    assert build_symbol_packet(first, selected_symbols=("lost",)).packet_sha256 == build_symbol_packet(\n        second, selected_symbols=("lost",)\n    ).packet_sha256',
              '    first_packet = build_symbol_packet(first, selected_symbols=("lost",))\n    second_packet = build_symbol_packet(second, selected_symbols=("lost",))\n    assert first_packet.packet_sha256 == second_packet.packet_sha256',
          )
          p.write_text(text)
          PY
          ruff check --fix src/job_app_helix/symbol_restoration.py src/job_app_helix/restoration_cli.py tests/test_symbol_restoration.py
          ruff format src/job_app_helix/symbol_restoration.py src/job_app_helix/restoration_cli.py tests/test_symbol_restoration.py
          ruff check src/job_app_helix/symbol_restoration.py src/job_app_helix/restoration_cli.py tests/test_symbol_restoration.py
      - name: Commit formatter delta
        run: |
          git config user.name "APEX Formatter"
          git config user.email "apex-formatter@users.noreply.github.com"
          git add src/job_app_helix/symbol_restoration.py src/job_app_helix/restoration_cli.py tests/test_symbol_restoration.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format symbol restoration implementation"
          git push origin HEAD:apex/symbol-restoration-ast-20260816
