name: Mega-Skills Projection Contract

on:
  pull_request:
    paths:
      - "manifests/mega_skills_source_lock.json"
      - "generated/mega-skills-public-projection.json"
      - "scripts/compile_mega_skills_projection.py"
      - ".github/workflows/mega-skills-projection-contract.yml"
  push:
    branches: [main]
    paths:
      - "manifests/mega_skills_source_lock.json"
      - "generated/mega-skills-public-projection.json"
      - "scripts/compile_mega_skills_projection.py"
      - ".github/workflows/mega-skills-projection-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lock-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify pinned generated bundle
        run: python scripts/compile_mega_skills_projection.py --verify-bundle generated/mega-skills-public-projection.json
      - name: Syntax and whitespace gate
        run: |
          python -m py_compile scripts/compile_mega_skills_projection.py
          git diff --check
