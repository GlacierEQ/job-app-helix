name: Opening Acquisition Proof
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "src/job_app_helix/opening_acquisition.py"
      - "tests/test_opening_acquisition.py"
      - ".github/workflows/opening-acquisition-proof.yml"
  workflow_dispatch:

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .[dev]
      - name: Lint focused delta
        run: python -m ruff check src/job_app_helix/opening_acquisition.py tests/test_opening_acquisition.py
      - name: Prove acquisition and change detection
        run: python -m pytest -q tests/test_opening_acquisition.py
      - name: Prove executable CLI
        run: python -m job_app_helix.opening_acquisition --help
