name: Repository Health Engine

on:
  push:
    branches: [main]
    paths:
      - "manifests/repository_health_policy.json"
      - "schemas/repository_health_input.schema.json"
      - "src/job_app_helix/repository_health.py"
      - "scripts/compute_repository_health.py"
      - "tests/test_repository_health.py"
      - "tests/fixtures/repository_health_elite.json"
      - "docs/REPOSITORY_HEALTH_ENGINE.md"
      - ".github/workflows/repository-health-engine.yml"
  pull_request:
    paths:
      - "manifests/repository_health_policy.json"
      - "schemas/repository_health_input.schema.json"
      - "src/job_app_helix/repository_health.py"
      - "scripts/compute_repository_health.py"
      - "tests/test_repository_health.py"
      - "tests/fixtures/repository_health_elite.json"
      - "docs/REPOSITORY_HEALTH_ENGINE.md"
      - ".github/workflows/repository-health-engine.yml"

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install focused test dependency
        run: python -m pip install pytest==9.1.1

      - name: Compile health engine
        run: python -m compileall -q src/job_app_helix/repository_health.py scripts/compute_repository_health.py tests/test_repository_health.py

      - name: Run fail-closed scoring regressions
        run: python -m pytest -q tests/test_repository_health.py

      - name: Exercise deterministic CLI and elite gate
        run: |
          python scripts/compute_repository_health.py \
            tests/fixtures/repository_health_elite.json \
            --output /tmp/repository-health.json \
            --require-elite
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/repository-health.json').read_text())
          assert result['health_state'] == 'ELITE_VERIFIED'
          assert result['health_score'] == 96
          assert result['evidence_coverage'] == 100
          assert result['elite_gate_failures'] == []
          print(result['assessment_id'])
          PY
