name: Repository Excellence Contract
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "src/job_app_helix/repo_excellence.py"
      - "src/job_app_helix/repo_excellence_evolution.py"
      - "manifests/repo_excellence/**"
      - "manifests/company_projections/**"
      - "excellence/receipts/**"
      - "scripts/validate_apex_evolution_external_proof.py"
      - "tests/test_repo_excellence.py"
      - "tests/test_repo_excellence_source_binding.py"
      - "tests/test_repo_excellence_evolution.py"
      - ".github/workflows/repo-excellence-contract.yml"
  push:
    branches:
      - main
    paths:
      - "src/job_app_helix/repo_excellence.py"
      - "src/job_app_helix/repo_excellence_evolution.py"
      - "manifests/repo_excellence/**"
      - "manifests/company_projections/**"
      - "excellence/receipts/**"
      - "scripts/validate_apex_evolution_external_proof.py"
      - "tests/test_repo_excellence.py"
      - "tests/test_repo_excellence_source_binding.py"
      - "tests/test_repo_excellence_evolution.py"
      - ".github/workflows/repo-excellence-contract.yml"

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded verification dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint repository-excellence surfaces
        run: >-
          ruff check
          src/job_app_helix/repo_excellence.py
          src/job_app_helix/repo_excellence_evolution.py
          scripts/validate_apex_evolution_external_proof.py
          tests/test_repo_excellence.py
          tests/test_repo_excellence_source_binding.py
          tests/test_repo_excellence_evolution.py
      - name: Verify repository-excellence contract
        run: >-
          pytest -q
          tests/test_repo_excellence.py
          tests/test_repo_excellence_source_binding.py
          tests/test_repo_excellence_evolution.py
      - name: Verify public evolution proof provenance
        run: python scripts/validate_apex_evolution_external_proof.py
