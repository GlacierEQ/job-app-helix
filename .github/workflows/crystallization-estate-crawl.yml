name: Crystallization estate crawl
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:
    inputs:
      content_mode:
        description: Source inspection depth
        required: true
        default: priority
        type: choice
        options:
          - tree-only
          - priority
          - all-text
      start:
        description: Repository start offset (ignored when hourly_shard_size is set)
        required: false
        default: "0"
        type: string
      limit:
        description: Repository count for manual shard; blank means remainder
        required: false
        default: ""
        type: string
      hourly_shard_size:
        description: Optional deterministic rotating shard size
        required: false
        default: ""
        type: string
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out Helix
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Prove crawler, uplift routing, and zero-exemption queue behavior
        run: >-
          python -m pytest -q
          tests/test_crystallization_crawler.py
          tests/test_private_crystallization_publisher.py
          tests/test_crystallization_uplift_digest.py
          tests/test_estate_work_queue.py

      - name: Require authenticated private estate authority
        env:
          ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ESTATE_TOKEN:-}" ]; then
            echo "GLACIEREQ_ESTATE_TOKEN is required for the private crystallization crawl." >&2
            exit 1
          fi

      - name: Resolve crawl mode
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.content_mode }}
          INPUT_START: ${{ inputs.start }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_HOURLY: ${{ inputs.hourly_shard_size }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "schedule" ]; then
            echo "mode=priority" >> "${GITHUB_OUTPUT}"
            echo "hourly=50" >> "${GITHUB_OUTPUT}"
            echo "start=0" >> "${GITHUB_OUTPUT}"
            echo "limit=" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=${INPUT_MODE:-priority}" >> "${GITHUB_OUTPUT}"
            echo "hourly=${INPUT_HOURLY:-}" >> "${GITHUB_OUTPUT}"
            echo "start=${INPUT_START:-0}" >> "${GITHUB_OUTPUT}"
            echo "limit=${INPUT_LIMIT:-}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Crawl private estate shard without leaking private logs
        id: crawl
        env:
          GLACIEREQ_ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
          MODE: ${{ steps.plan.outputs.mode }}
          START: ${{ steps.plan.outputs.start }}
          LIMIT: ${{ steps.plan.outputs.limit }}
          HOURLY: ${{ steps.plan.outputs.hourly }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            python scripts/crawl_crystallization_estate.py
            --output /tmp/crystallization-receipt.json
            --content-mode "${MODE}"
            --workers 10
            --start "${START}"
          )
          if [ -n "${LIMIT:-}" ]; then
            args+=(--limit "${LIMIT}")
          fi
          if [ -n "${HOURLY:-}" ]; then
            args+=(--hourly-shard-size "${HOURLY}")
          fi

          set +e
          "${args[@]}" >/tmp/private-crawl.log 2>&1
          code=$?
          set -e
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          test -s /tmp/crystallization-receipt.json || {
            echo "Private crawl failed before a receipt could be created." >&2
            exit 1
          }

      - name: Build compact code-uplift routing digest
        run: >-
          python scripts/build_crystallization_uplift_digest.py
          --input /tmp/crystallization-receipt.json
          --output /tmp/crystallization-uplift.json

      - name: Preserve raw crawl evidence privately
        uses: actions/upload-artifact@v4
        with:
          name: private-crystallization-raw-${{ github.run_id }}
          path: /tmp/crystallization-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Resolve compact Monolith uplift destination
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/crystallization-receipt.json').read_text())
          mode = receipt['content_mode']
          start = receipt.get('selection_start')
          selected = receipt['selected_repository_count']
          shard = receipt.get('hourly_shard_index')
          digest = receipt['receipt_digest'][:12]
          if shard is not None:
              stop = start + selected - 1 if selected else start
              destination = f'catalog/crystallization/uplift/{mode}-{start:04d}-{stop:04d}.json'
          elif start is None:
              destination = f'catalog/crystallization/uplift/explicit-{mode}-{digest}.json'
          else:
              stop = start + selected - 1 if selected else start
              destination = f'catalog/crystallization/uplift/manual-{mode}-{start:04d}-{stop:04d}.json'
          print(f'destination={destination}')
          PY

      - name: Publish compact uplift intelligence into Monolith
        env:
          GLACIEREQ_ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
          DESTINATION: ${{ steps.destination.outputs.destination }}
        run: >-
          python scripts/publish_private_crystallization_receipt.py
          /tmp/crystallization-uplift.json
          --repository GlacierEQ/monolith
          --destination "${DESTINATION}"

      - name: Emit public-safe uplift summary only
        shell: bash
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path

          r = json.loads(Path('/tmp/crystallization-receipt.json').read_text())
          u = json.loads(Path('/tmp/crystallization-uplift.json').read_text())
          print('### Crystallization estate crawl → code uplift')
          print()
          print(f"- Accessible repositories: {r['accessible_repository_count']}")
          print(f"- Repositories in this shard: {r['selected_repository_count']}")
          print(f"- Repositories crawled: {r['repository_crawled_count']}")
          print(f"- Files accounted: {r['file_accounted_count']}")
          print(f"- Text files inspected: {r['text_inspected_count']}")
          print(f"- Unresolved content objects: {r['unresolved_content_count']}")
          print(f"- Repository failures: {r['repository_failure_count']}")
          print(f"- Content mode: {r['content_mode']}")
          print(f"- Uplift queue entries: {u['queue_count']}")
          print(f"- Raw evidence artifact: private-crystallization-raw-${{ github.run_id }}")
          print()
          print('Raw per-file evidence is preserved as a private workflow artifact.')
          print('Monolith receives compact evidence-bounded code-uplift routing intelligence.')
          PY

      - name: Fail closed after evidence preservation and uplift publication
        if: steps.crawl.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Crystallization crawl reported unresolved repository failures. Raw evidence and compact uplift routing were preserved." >&2
          exit 1
