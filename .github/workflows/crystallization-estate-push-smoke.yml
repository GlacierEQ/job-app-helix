name: Crystallization estate push smoke
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/crystallization-estate-*.yml"
      - "src/job_app_helix/crystallization_crawler.py"
      - "scripts/crawl_crystallization_estate.py"
      - "scripts/publish_private_crystallization_receipt.py"
      - "scripts/build_estate_work_queue.py"

permissions:
  contents: read

jobs:
  private-crawl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Helix
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Prove crawler execution code
        run: >-
          python -m pytest -q
          tests/test_crystallization_crawler.py
          tests/test_crystallization_crawl_cli.py
          tests/test_private_crystallization_publisher.py
          tests/test_estate_work_queue.py

      - name: Require private estate token
        env:
          ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ESTATE_TOKEN:-}" ]; then
            echo "GLACIEREQ_ESTATE_TOKEN is required for crawl smoke." >&2
            exit 1
          fi

      - name: Crawl one deterministic private estate shard
        id: crawl
        env:
          GLACIEREQ_ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python scripts/crawl_crystallization_estate.py \
            --output /tmp/crystallization-smoke.json \
            --content-mode priority \
            --hourly-shard-size 25 \
            --workers 6 \
            >/tmp/private-crystallization-smoke.log 2>&1
          code=$?
          set -e
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          test -s /tmp/crystallization-smoke.json || {
            echo "Private crawl smoke failed before producing a receipt." >&2
            exit 1
          }

      - name: Resolve private shard destination
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/crystallization-smoke.json').read_text())
          start = receipt.get('selection_start') or 0
          selected = receipt['selected_repository_count']
          stop = start + selected - 1 if selected else start
          print(f'destination=catalog/crystallization/shards/priority-{start:04d}-{stop:04d}.json')
          PY

      - name: Publish full receipt to private monolith
        env:
          GLACIEREQ_ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
          DESTINATION: ${{ steps.destination.outputs.destination }}
        run: >-
          python scripts/publish_private_crystallization_receipt.py
          /tmp/crystallization-smoke.json
          --repository GlacierEQ/monolith
          --destination "${DESTINATION}"

      - name: Publish public-safe aggregate summary
        shell: bash
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path

          r = json.loads(Path('/tmp/crystallization-smoke.json').read_text())
          print('### Private crystallization crawl smoke')
          print()
          print(f"- Accessible repositories: {r['accessible_repository_count']}")
          print(f"- Repositories selected: {r['selected_repository_count']}")
          print(f"- Repositories crawled: {r['repository_crawled_count']}")
          print(f"- Files accounted: {r['file_accounted_count']}")
          print(f"- Text inspected: {r['text_inspected_count']}")
          print(f"- Unresolved content: {r['unresolved_content_count']}")
          print(f"- Repository failures: {r['repository_failure_count']}")
          print()
          print('Repository identities and per-file evidence remain private in monolith.')
          PY

      - name: Fail closed after preserving receipt
        if: steps.crawl.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Private crawl smoke preserved a receipt but reported unresolved failures." >&2
          exit 1
