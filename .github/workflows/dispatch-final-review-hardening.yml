name: Dispatch final review hardening

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-final-review-hardening.yml"

permissions:
  contents: write

concurrency:
  group: dispatch-final-review-hardening
  cancel-in-progress: false

env:
  HARDENING_TRANSACTION: "2026-07-30-final-form"

jobs:
  patch-promotion-branch:
    name: Apply, prove, and commit reviewed fixes
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed promotion branch
        uses: actions/checkout@v6
        with:
          ref: deploy/canonical-recruiter-surface-2026-07-30
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply exact reviewed fixes
        run: python scripts/apply_final_review_fixes.py

      - name: Install exactly from committed lock
        run: uv sync --extra dev --locked

      - name: Execute complete suite
        run: uv run --locked pytest

      - name: Run strict lint
        run: uv run --locked ruff check src tests scripts ci_audit_portfolio.py showcase/demo_15min_run.py

      - name: Commit one verified branch transaction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Final review fixes already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add scripts/build_recruiter_site.py scripts/cleanup_obsolete_branches.py \
            tests/test_recruiter_site_deployment.py tests/test_obsolete_branch_cleanup.py
          git commit -m "fix: close final deployment and cleanup edge cases"
          git push origin HEAD:deploy/canonical-recruiter-surface-2026-07-30
