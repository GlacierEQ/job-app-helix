name: Estate Federated Recovery Proof
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "src/job_app_helix/estate_federated_recovery.py"
      - "src/job_app_helix/estate_recovery_census.py"
      - "src/job_app_helix/recovery_ref_graph.py"
      - "src/job_app_helix/federated_restoration.py"
      - "tests/test_estate_federated_recovery.py"
      - "pyproject.toml"
      - ".github/workflows/estate-federated-recovery-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/job_app_helix/estate_federated_recovery.py"
      - "src/job_app_helix/estate_recovery_census.py"
      - "src/job_app_helix/recovery_ref_graph.py"
      - "src/job_app_helix/federated_restoration.py"
      - "tests/test_estate_federated_recovery.py"
      - "pyproject.toml"
      - ".github/workflows/estate-federated-recovery-proof.yml"

jobs:
  proof:
    name: Estate composition / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and proof tools
        run: python -m pip install -e ".[dev]"

      - name: Lint estate composition surface
        run: >-
          ruff check
          src/job_app_helix/estate_federated_recovery.py
          tests/test_estate_federated_recovery.py

      - name: Run estate-to-semantic integration tests
        run: python -m pytest -q tests/test_estate_federated_recovery.py

      - name: Prove installed executable
        run: job-app-helix-estate-compose --help
