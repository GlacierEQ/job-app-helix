name: Target Application Cycle Proof
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "src/job_app_helix/target_application_cycle.py"
      - "src/job_app_helix/candidate_profile_compiler.py"
      - "src/job_app_helix/target_intelligence_cycle.py"
      - "tests/test_target_application_cycle.py"
      - "tests/test_target_application_resume_source.py"
      - "tests/test_candidate_profile_compiler.py"
      - "pyproject.toml"
      - ".github/workflows/target-application-cycle-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/job_app_helix/target_application_cycle.py"
      - "src/job_app_helix/candidate_profile_compiler.py"
      - "src/job_app_helix/target_intelligence_cycle.py"
      - "tests/test_target_application_cycle.py"
      - "tests/test_target_application_resume_source.py"
      - "tests/test_candidate_profile_compiler.py"
      - "pyproject.toml"
      - ".github/workflows/target-application-cycle-proof.yml"

permissions:
  contents: read

jobs:
  application-ready:
    name: Application-ready / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and proof tools
        run: python -m pip install -e '.[dev]'

      - name: Lint application-ready executable surface
        run: >-
          ruff check
          src/job_app_helix/target_application_cycle.py
          src/job_app_helix/candidate_profile_compiler.py
          tests/test_target_application_cycle.py
          tests/test_target_application_resume_source.py
          tests/test_candidate_profile_compiler.py

      - name: Run adversarial application-ready tests
        run: >-
          python -m pytest -q
          tests/test_target_application_cycle.py
          tests/test_target_application_resume_source.py
          tests/test_candidate_profile_compiler.py

      - name: Prove installed executable
        run: |
          job-app-helix-target-application --help
          job-app-helix-profile --help
