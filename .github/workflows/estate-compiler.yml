name: Estate compiler
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - "schemas/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/estate-compiler.yml"
  pull_request:
    paths:
      - "manifests/**"
      - "schemas/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/estate-compiler.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 16 * * *"

permissions:
  contents: read

jobs:
  verify:
    name: Verify compiler and public boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Check out Helix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify reference compiler and projection contracts
        run: >-
          python -m pytest -q
          tests/test_estate_compiler.py
          tests/test_estate_intelligence.py
          tests/test_compiled_recruiter_site.py
          tests/test_public_portfolio_census.py

  compile:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Check out Helix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify reference compiler and projection contracts
        run: >-
          python -m pytest -q
          tests/test_estate_compiler.py
          tests/test_estate_intelligence.py
          tests/test_compiled_recruiter_site.py
          tests/test_public_portfolio_census.py

      - name: Detect private estate census authority
        id: estate-auth
        env:
          ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          if [ -n "${ESTATE_TOKEN:-}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "mode=private" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "mode=public" >> "${GITHUB_OUTPUT}"
            echo "Private estate authority unavailable; compiling governed public portfolio."
          fi

      - name: Build authenticated full estate census
        if: steps.estate-auth.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        run: >-
          python scripts/census_owned_library.py
          --token "${GITHUB_TOKEN}"
          --output /tmp/estate-census.json

      - name: Select authenticated estate facts
        if: steps.estate-auth.outputs.available == 'true'
        run: cp manifests/estate_facts.json /tmp/estate-facts.json

      - name: Build governed public portfolio census
        if: steps.estate-auth.outputs.available != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/census_public_portfolio.py
          --token "${GITHUB_TOKEN}"
          --output /tmp/estate-census.json

      - name: Select fail-closed public estate facts
        if: steps.estate-auth.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s
' '{"namespaces":[],"relationships":[]}' \
            > /tmp/estate-facts.json

      - name: Compile reference estate bundle
        run: |
          python scripts/compile_estate_graph.py \
            --census /tmp/estate-census.json \
            --estate-facts /tmp/estate-facts.json \
            --output-dir /tmp/estate-compiler

      - name: Project role fit and company intelligence
        run: |
          python scripts/project_estate_intelligence.py \
            --bundle /tmp/estate-compiler/estate-compiler-bundle.json \
            --census /tmp/estate-census.json \
            --estate-facts /tmp/estate-facts.json \
            --output /tmp/estate-compiler/estate-intelligence-bundle.json \
            --public-output /tmp/estate-compiler/public-safe-company-projection-v2.json

      - name: Verify public projection with canonical recruiter validator
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          module_path = Path("scripts/build_compiled_recruiter_site.py")
          spec = importlib.util.spec_from_file_location("public_validator", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load canonical public validator")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          public_path = Path("/tmp/estate-compiler/public-safe-company-projection-v2.json")
          module.validate_public_projection(
              json.loads(public_path.read_text(encoding="utf-8"))
          )
          PY

      - name: Verify public-safe boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          public_path = Path(
              "/tmp/estate-compiler/public-safe-company-projection-v2.json"
          )
          receipt_path = Path(
              "/tmp/estate-compiler/estate-intelligence-receipt.json"
          )
          public = json.loads(public_path.read_text(encoding="utf-8"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          census = json.loads(
              Path("/tmp/estate-census.json").read_text(encoding="utf-8")
          )
          private_repositories = {
              row["repository"]
              for row in census.get("repositories", [])
              if row.get("visibility") == "private"
              and isinstance(row.get("repository"), str)
          }
          rendered_public = json.dumps(public, sort_keys=True)
          leaked_private_repositories = sorted(
              repository
              for repository in private_repositories
              if repository in rendered_public
          )
          assert not leaked_private_repositories, leaked_private_repositories
          assert public["schema"] == "glaciereq.estate-public-projection.v2"
          boundary = public["boundary"]
          assert boundary["private_repository_identities_omitted"] is True
          assert boundary["legal_private_records_omitted"] is True
          assert (
              boundary[
                  "native_estate_cardinality_intentionally_not_published"
              ]
              is True
          )
          assert (
              receipt["invariants"][
                  "support_references_do_not_collapse_lineage"
              ]
              is True
          )

          forbidden = {
              "repository_count",
              "native_repository_count",
              "fork_repository_count",
              "private_repository_count",
              "legal_private_repositories",
              "reference_accomplishments",
          }

          def walk(value, path="$"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in forbidden:
                          raise SystemExit(
                              f"forbidden public key {path}.{key}"
                          )
                      walk(child, f"{path}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{path}[{index}]")

          walk(public)
          PY

      - name: Stage only sanitized public projection
        id: stage-public
        run: |
          set -euo pipefail
          stage_dir="${RUNNER_TEMP}/estate-compiler-public"
          rm -rf "${stage_dir}"
          mkdir -p "${stage_dir}"
          cp /tmp/estate-compiler/public-safe-company-projection-v2.json \
            "${stage_dir}/public-safe-company-projection-v2.json"

          # Stage from an isolated temporary directory. The repository contains
          # historical/private build artifacts; their presence in the checkout
          # must never make the upload boundary either fail spuriously or widen.
          forbidden=(
            owned-library-census.json
            public-portfolio-census.json
            estate-compiler/reference-system-registry.json
            estate-compiler/company-projection-registry.json
            estate-intelligence-receipt.json
          )
          for relative_path in "${forbidden[@]}"; do
            test ! -e "${stage_dir}/${relative_path}"
          done

          mapfile -t staged_files < <(
            find "${stage_dir}" -type f -printf '%P
' | sort
          )
          test "${#staged_files[@]}" -eq 1
          test "${staged_files[0]}" = \
            "public-safe-company-projection-v2.json"
          echo "directory=${stage_dir}" >> "${GITHUB_OUTPUT}"

      - name: Record census authority mode
        shell: bash
        run: |
          {
            echo "### Estate compiler authority"
            echo
            echo "Mode: ${{ steps.estate-auth.outputs.mode }}"
            echo
            if [ "${{ steps.estate-auth.outputs.available }}" = "true" ]; then
              echo "Compiled from authenticated private estate authority."
            else
              echo "Compiled from the governed public portfolio fallback."
              echo "No private estate cardinality or private repository identity was published."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload only sanitized public projection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: estate-compiler-public-safe-${{ github.run_id }}
          path: ${{ steps.stage-public.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
