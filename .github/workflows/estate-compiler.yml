name: Estate compiler

on:
  workflow_dispatch:
  schedule:
    - cron: "41 16 * * *"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Helix
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify canonical compiler and projection contracts
        run: >-
          python -m pytest -q
          tests/test_estate_compiler.py
          tests/test_estate_intelligence.py
          tests/test_compiled_recruiter_site.py
          tests/test_public_portfolio_census.py

      - name: Detect private estate census authority
        id: estate-auth
        env:
          ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          if [ -n "${ESTATE_TOKEN:-}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "mode=private" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "mode=public" >> "${GITHUB_OUTPUT}"
            echo "Private estate authority unavailable; compiling governed public portfolio."
          fi

      - name: Build authenticated full estate census
        if: steps.estate-auth.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        run: >-
          python scripts/census_owned_library.py
          --token "${GITHUB_TOKEN}"
          --output /tmp/estate-census.json

      - name: Select authenticated estate facts
        if: steps.estate-auth.outputs.available == 'true'
        run: cp manifests/estate_facts.json /tmp/estate-facts.json

      - name: Build governed public portfolio census
        if: steps.estate-auth.outputs.available != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/census_public_portfolio.py
          --token "${GITHUB_TOKEN}"
          --output /tmp/estate-census.json

      - name: Select fail-closed public estate facts
        if: steps.estate-auth.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"namespaces":[],"relationships":[]}' \
            > /tmp/estate-facts.json

      - name: Compile canonical estate bundle
        run: |
          python scripts/compile_estate_graph.py \
            --census /tmp/estate-census.json \
            --estate-facts /tmp/estate-facts.json \
            --output-dir /tmp/estate-compiler

      - name: Project role fit and company intelligence
        run: |
          python scripts/project_estate_intelligence.py \
            --bundle /tmp/estate-compiler/estate-compiler-bundle.json \
            --census /tmp/estate-census.json \
            --estate-facts /tmp/estate-facts.json \
            --output /tmp/estate-compiler/estate-intelligence-bundle.json \
            --public-output /tmp/estate-compiler/public-safe-company-projection-v2.json

      - name: Verify public-safe boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          public_path = Path(
              "/tmp/estate-compiler/public-safe-company-projection-v2.json"
          )
          receipt_path = Path(
              "/tmp/estate-compiler/estate-intelligence-receipt.json"
          )
          public = json.loads(public_path.read_text(encoding="utf-8"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          assert public["schema"] == "glaciereq.estate-public-projection.v2"
          boundary = public["boundary"]
          assert boundary["private_repository_identities_omitted"] is True
          assert boundary["legal_private_records_omitted"] is True
          assert (
              boundary[
                  "native_estate_cardinality_intentionally_not_published"
              ]
              is True
          )
          assert (
              receipt["invariants"][
                  "support_references_do_not_collapse_lineage"
              ]
              is True
          )

          forbidden = {
              "repository_count",
              "native_repository_count",
              "fork_repository_count",
              "private_repository_count",
              "legal_private_repositories",
              "canonical_accomplishments",
          }

          def walk(value, path="$"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in forbidden:
                          raise SystemExit(
                              f"forbidden public key {path}.{key}"
                          )
                      walk(child, f"{path}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{path}[{index}]")

          walk(public)
          PY

      - name: Stage only sanitized public projection
        run: |
          set -euo pipefail
          mkdir -p artifacts/estate-compiler-public
          cp /tmp/estate-compiler/public-safe-company-projection-v2.json \
            artifacts/estate-compiler-public/public-safe-company-projection-v2.json
          test ! -e artifacts/owned-library-census.json
          test ! -e artifacts/public-portfolio-census.json
          test ! -e artifacts/estate-compiler/canonical-system-registry.json
          test ! -e artifacts/estate-compiler/company-projection-registry.json
          test ! -e artifacts/estate-compiler-public/estate-intelligence-receipt.json

      - name: Record census authority mode
        shell: bash
        run: |
          {
            echo "### Estate compiler authority"
            echo
            echo "Mode: ${{ steps.estate-auth.outputs.mode }}"
            echo
            if [ "${{ steps.estate-auth.outputs.available }}" = "true" ]; then
              echo "Compiled from authenticated private estate authority."
            else
              echo "Compiled from the governed public portfolio fallback."
              echo "No private estate cardinality or private repository identity was published."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload only sanitized public projection
        uses: actions/upload-artifact@v4
        with:
          name: estate-compiler-public-safe-${{ github.run_id }}
          path: artifacts/estate-compiler-public
          if-no-files-found: error
          retention-days: 30
