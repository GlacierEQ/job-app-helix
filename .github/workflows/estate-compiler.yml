name: Estate compiler

on:
  workflow_dispatch:
  schedule:
    - cron: "41 16 * * *"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Helix
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build authenticated full estate census
        env:
          GITHUB_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        run: |
          test -n "${GITHUB_TOKEN}" || {
            echo "GLACIEREQ_ESTATE_TOKEN is required for the private owner census" >&2
            exit 1
          }
          python scripts/census_owned_library.py \
            --token "${GITHUB_TOKEN}" \
            --output artifacts/owned-library-census.json

      - name: Verify estate compiler contract
        run: python -m pytest tests/test_estate_compiler.py

      - name: Compile systems, donors, and company projections
        run: |
          python scripts/compile_estate_graph.py \
            --census artifacts/owned-library-census.json \
            --output-dir artifacts/estate-compiler \
            --public-output artifacts/estate-compiler/public-safe-company-projection.json

      - name: Verify public-safe boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          public = json.loads(Path("artifacts/estate-compiler/public-safe-company-projection.json").read_text())
          receipt = json.loads(Path("artifacts/estate-compiler/estate-compiler-receipt.json").read_text())
          assert public["schema"] == "glaciereq.estate-public-projection.v1"
          assert receipt["invariants"]["legal_private_namespace_not_company_projectable"] is True
          PY

      - name: Upload only public-safe compiler outputs
        uses: actions/upload-artifact@v4
        with:
          name: estate-compiler-public-safe-${{ github.run_id }}
          path: |
            artifacts/estate-compiler/estate-compiler-receipt.json
            artifacts/estate-compiler/public-safe-company-projection.json
          if-no-files-found: error
          retention-days: 30
