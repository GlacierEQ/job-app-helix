name: Calibration Diagnostics Proof
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "src/job_app_helix/calibration_diagnostics.py"
      - "tests/test_calibration_diagnostics.py"
      - ".github/workflows/calibration-diagnostics-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint capability delta
        run: ruff check src/job_app_helix/calibration_diagnostics.py tests/test_calibration_diagnostics.py
      - name: Run adversarial diagnostics tests
        run: pytest tests/test_calibration_diagnostics.py -q
      - name: Prove executable surface
        run: python -m job_app_helix.calibration_diagnostics --help
