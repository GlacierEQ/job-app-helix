name: Promote Lockheed V21 Evidence Stages

on:
  push:
    branches:
      - second-depth/lockheed-v21-complete
    paths:
      - .github/workflows/promote-lockheed-v21.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: second-depth/lockheed-v21-complete
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote four cumulative stages with native validation
        run: |
          set -euo pipefail
          git config user.name casey
          git config user.email GLACIER.EQUILIBRIUM@GMAIL.COM
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          ROOT = Path('.')
          manifest_path = ROOT / 'manifests/company_second_depth.json'
          evidence_dir = ROOT / 'evidence/company_second_depth/lockheed_martin'
          evidence_dir.mkdir(parents=True, exist_ok=True)
          impl_sha = '4328fa7078e6e4125f895768142c6af0c5ec1234'
          base = f'https://github.com/GlacierEQ/job-application/blob/{impl_sha}/projects/mission-agentic-ai-assurance'

          def ref(identifier: str, kind: str, relative: str, verification: str = 'VERIFIED'):
              return {
                  'id': identifier,
                  'kind': kind,
                  'source_identity': f'{base}/{relative}',
                  'source_ref': f'commit:{impl_sha}',
                  'visibility': 'public',
                  'verification_state': verification,
              }

          def write_json(path: Path, payload):
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          def manifest():
              return json.loads(manifest_path.read_text(encoding='utf-8'))

          def commit(message: str, paths: list[str]):
              subprocess.run(['python', 'scripts/validate_company_second_depth.py'], check=True)
              subprocess.run(['git', 'add', *paths], check=True)
              subprocess.run(['git', 'commit', '-m', message], check=True)

          data = manifest()
          lockheed = data['company_overrides']['lockheed_martin']
          remedy_ref = ref('lockheed_remedy_mission_agentic_ai_assurance', 'bounded_gap', 'machine/remedy.json')
          lockheed.update({
              'stage': 'REMEDY_BOUNDED',
              'gap_queue': [remedy_ref],
              'claim_ceiling': 'bounded_remedy_design',
              'blockers': [
                  'implementation_not_yet_accepted_as_company_specific_capability',
                  'proof_not_yet_promoted_in_helix',
                  'distributed_state_not_implemented',
                  'workload_identity_not_implemented',
              ],
              'next_gate': 'Verify the implemented Mission Agentic AI Assurance reference at its immutable public commit and admit its implementation receipt without implying Lockheed Martin adoption.',
          })
          data['generated_at'] = '2026-08-07T15:05:00-10:00'
          write_json(manifest_path, data)
          remedy_path = evidence_dir / 'remedy_mission_agentic_ai_assurance.json'
          write_json(remedy_path, {
              'schema': 'glaciereq.bounded-remedy-evidence.v1',
              'company_id': 'lockheed_martin',
              'remedy_id': 'mission_agentic_ai_assurance',
              'source_repository': 'GlacierEQ/job-application',
              'source_commit': impl_sha,
              'source_path': 'projects/mission-agentic-ai-assurance/machine/remedy.json',
              'public_problem': 'Integrate and operationalize agentic AI/ML across disparate mission software while preserving traceability, reliability, explainability, monitoring, testability, and CI/CD discipline.',
              'requirements_to_capabilities': {
                  'traceability': ['content-bound evidence snapshots', 'request/evidence/policy/outcome hashes', 'deterministic receipts'],
                  'reliability': ['single-process idempotency', 'conflicting replay rejection', 'circuit breaker'],
                  'explainability': ['explicit decisions', 'reason codes', 'hash-bound outcomes'],
                  'monitoring': ['finite-metric drift gate'],
                  'testability': ['deterministic standard-library core', '17 adversarial/unit tests'],
                  'ci_cd_discipline': ['Python matrix', 'fixed-set proof manifest', 'exact demo reproduction'],
              },
              'proposed_architecture': ['agent_or_orchestrator', 'mission_assurance_gateway', 'policy_gate', 'evidence_validator', 'drift_gate', 'idempotency_boundary', 'circuit_breaker', 'executor_boundary', 'deterministic_receipt'],
              'failure_domains': ['evidence_integrity', 'policy_failure', 'replay_conflict', 'executor_failure', 'monitoring_limit', 'state_durability', 'scale'],
              'unresolved_gaps': ['durable_distributed_state', 'authenticated_workload_identity', 'tamper_evident_external_store', 'real_telemetry_adapters', 'sandboxed_executor', 'cross_language_conformance', 'signed_release_attestations', 'load_chaos_recovery_benchmarks'],
              'acceptance_contract': ['valid_evidence_can_allow', 'missing_evidence_fails_closed', 'content_hash_mismatch_rejected', 'non_finite_metrics_rejected', 'concurrent_identical_calls_execute_once', 'conflicting_replay_rejected', 'executor_failures_receipted', 'exact_demo_reproduction', 'fixed_set_proof_manifest_verifies'],
              'boundary': 'Independent public candidate architecture derived from public requirements and inspected GlacierEQ mechanisms; no Lockheed Martin adoption, deployment, affiliation, proprietary access, contract, clearance, certification, or measured impact is claimed.',
          })
          commit('second-depth(lockheed): promote to REMEDY_BOUNDED', [str(manifest_path), str(remedy_path)])

          data = manifest()
          lockheed = data['company_overrides']['lockheed_martin']
          implementation_ref = ref('lockheed_implementation_mission_agentic_ai_assurance', 'implementation_receipt', 'proof/implementation_receipt.json')
          lockheed.update({
              'stage': 'IMPLEMENTED',
              'implementation_receipts': [implementation_ref],
              'claim_ceiling': 'implemented_candidate_capability',
              'blockers': ['proof_not_yet_promoted_in_helix', 'distributed_state_not_implemented', 'workload_identity_not_implemented', 'production_scale_not_demonstrated'],
              'next_gate': 'Reproduce the committed deterministic proof and admit it as a REPRODUCED proof artifact before raising the claim ceiling.',
          })
          write_json(manifest_path, data)
          implementation_path = evidence_dir / 'implementation_mission_agentic_ai_assurance.json'
          write_json(implementation_path, {
              'schema': 'glaciereq.implementation-evidence.v1',
              'company_id': 'lockheed_martin',
              'implementation_id': 'mission_agentic_ai_assurance',
              'repository': 'GlacierEQ/job-application',
              'commit': impl_sha,
              'root': 'projects/mission-agentic-ai-assurance',
              'implementation_receipt': 'proof/implementation_receipt.json',
              'source_paths': ['src/mission_assurance/core.py', 'src/mission_assurance/__init__.py'],
              'implemented_capabilities': ['content_bound_public_evidence_snapshot_validation', 'canonical_request_hashing', 'canonical_machine_payload_adapter', 'finite_metric_validation', 'policy_gate', 'scalar_drift_gate', 'thread_safe_single_process_idempotent_replay', 'idempotency_conflict_detection', 'circuit_breaker', 'executor_failure_receipts', 'deterministic_assurance_receipts'],
              'boundary': 'Reference implementation only; single-process idempotency, not distributed exactly-once; no company deployment or production-scale claim.',
          })
          commit('second-depth(lockheed): promote to IMPLEMENTED', [str(manifest_path), str(implementation_path)])

          data = manifest()
          lockheed = data['company_overrides']['lockheed_martin']
          proof_ref = ref('lockheed_proof_mission_agentic_ai_assurance', 'proof_artifact', 'proof/reproduced_receipt.json', 'REPRODUCED')
          lockheed.update({
              'stage': 'PROOF_REPRODUCED',
              'proof_artifacts': [proof_ref],
              'claim_ceiling': 'reproducible_company_specific_proof',
              'blockers': ['claim_receipt_not_yet_promoted_in_helix', 'distributed_state_not_implemented', 'workload_identity_not_implemented', 'production_scale_not_demonstrated', 'certification_not_claimed'],
              'next_gate': 'Admit the explicit proof-bound claim receipt only if its wording stays within the reproduced reference implementation and preserves all non-affiliation and non-production boundaries.',
          })
          write_json(manifest_path, data)
          proof_path = evidence_dir / 'proof_mission_agentic_ai_assurance.json'
          write_json(proof_path, {
              'schema': 'glaciereq.reproduced-proof-evidence.v1',
              'company_id': 'lockheed_martin',
              'proof_id': 'mission_agentic_ai_assurance',
              'repository': 'GlacierEQ/job-application',
              'commit': impl_sha,
              'proof_receipt': 'projects/mission-agentic-ai-assurance/proof/reproduced_receipt.json',
              'receipt_id': 'b7a3e3cba968e19bb91ed8f6881b69e37efc97d7e8414be0aca431dff501123f',
              'proof_manifest': 'projects/mission-agentic-ai-assurance/proof/proof_manifest.json',
              'acceptance_tests': 17,
              'python_versions': ['3.11', '3.12', '3.13'],
              'network_required': False,
              'credentials_required': False,
              'external_model_required': False,
              'verification_state': 'REPRODUCED',
              'boundary': 'Reproducible proof of the independent reference implementation only; not proof of Lockheed Martin use, deployment, certification, production scale, or business impact.',
          })
          commit('second-depth(lockheed): promote to PROOF_REPRODUCED', [str(manifest_path), str(proof_path)])

          data = manifest()
          lockheed = data['company_overrides']['lockheed_martin']
          claim_ref = ref('lockheed_claim_mission_agentic_ai_assurance', 'claim_receipt', 'proof/claim_receipt.json')
          lockheed.update({
              'stage': 'CLAIM_PROMOTED',
              'claim_receipts': [claim_ref],
              'claim_ceiling': 'proof_bound_company_specific',
              'blockers': ['distributed_state_not_implemented', 'workload_identity_not_implemented', 'durable_tamper_evident_store_not_implemented', 'real_telemetry_adapters_not_implemented', 'sandboxed_executor_not_implemented', 'production_scale_not_demonstrated', 'aerospace_defense_certification_not_claimed'],
              'next_gate': 'Preserve this proof-bound claim while evolving the Mesh aspiration gaps through separately tested adapters; do not raise production-scale, certification, adoption, or company-deployment claims without new independent evidence.',
          })
          write_json(manifest_path, data)
          claim_path = evidence_dir / 'claim_mission_agentic_ai_assurance.json'
          write_json(claim_path, {
              'schema': 'glaciereq.claim-promotion-evidence.v1',
              'company_id': 'lockheed_martin',
              'claim_id': 'mission_agentic_ai_assurance',
              'repository': 'GlacierEQ/job-application',
              'commit': impl_sha,
              'claim_receipt': 'projects/mission-agentic-ai-assurance/proof/claim_receipt.json',
              'allowed_claim': 'Built and reproducibly tested an independent mission-agent assurance gateway combining content-bound public provenance snapshots, deterministic receipts, thread-safe single-process idempotency, finite-metric drift gating, policy decisions, and circuit breaking, using public mission-AI requirements as a bounded design lens.',
              'prohibited_claims': ['Lockheed Martin deployment or adoption', 'Lockheed Martin affiliation, employment, endorsement, contract, clearance, or proprietary access', 'distributed exactly-once semantics', 'production-scale distributed assurance', 'aerospace or defense certification', 'validation on classified or proprietary systems'],
              'boundary': 'Claim promotion means the public application wording is now proof-bound to the immutable reference implementation; it does not change company relationship or production-use facts.',
          })
          commit('second-depth(lockheed): promote to CLAIM_PROMOTED', [str(manifest_path), str(claim_path)])
          PY
          git push origin HEAD:second-depth/lockheed-v21-complete
