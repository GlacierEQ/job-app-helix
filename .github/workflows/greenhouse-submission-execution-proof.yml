name: Greenhouse Submission Execution Proof

on:
  push:
    branches: [main]
    paths:
      - "src/job_app_helix/greenhouse_submission_execution.py"
      - "tests/test_greenhouse_submission_execution.py"
      - "pyproject.toml"
      - ".github/workflows/greenhouse-submission-execution-proof.yml"
  pull_request:
    paths:
      - "src/job_app_helix/greenhouse_submission_execution.py"
      - "tests/test_greenhouse_submission_execution.py"
      - "pyproject.toml"
      - ".github/workflows/greenhouse-submission-execution-proof.yml"

jobs:
  submission-boundary:
    name: Submission Boundary / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and proof tools
        run: python -m pip install -e '.[dev]'
      - name: Lint submission boundary
        run: >-
          ruff check
          src/job_app_helix/greenhouse_submission_execution.py
          tests/test_greenhouse_submission_execution.py
      - name: Run adversarial submission-boundary tests
        run: pytest tests/test_greenhouse_submission_execution.py
      - name: Prove installed executable
        run: job-app-helix-greenhouse-submit --help
