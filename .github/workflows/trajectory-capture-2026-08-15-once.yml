name: Trajectory capture 2026-08-15 once

on:
  push:
    branches:
      - trajectory-captures-2026

permissions:
  contents: write

concurrency:
  group: trajectory-capture-2026-08-15-once
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'chore(trajectory): preserve 2026-08-15 exact snapshot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out preservation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: trajectory-captures-2026

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify trajectory contract
        run: |
          python -m pip install -q pytest jsonschema
          python -m pytest -q tests/test_trajectory_lattice.py

      - name: Require authenticated private-estate authority
        env:
          ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ESTATE_TOKEN:-}" ]; then
            echo "GLACIEREQ_ESTATE_TOKEN is required; refusing a partial public-only checkpoint." >&2
            exit 1
          fi

      - name: Capture authenticated estate snapshot
        env:
          GLACIEREQ_ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p machine/trajectory/checkpoints
          python scripts/capture_trajectory_checkpoint.py \
            --date 2026-08-15 \
            --output machine/trajectory/checkpoints/2026-08-15.json

      - name: Validate schema and truth boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          checkpoint_path = Path('machine/trajectory/checkpoints/2026-08-15.json')
          schema_path = Path('schemas/trajectory_checkpoint.schema.json')
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8'))
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator(schema).validate(checkpoint)

          inventory = checkpoint['state']['repository_inventory']
          heads = checkpoint['state']['canonical_heads']
          owned = inventory['owned_repository_count']
          if owned != len(heads):
              raise SystemExit(f'canonical head rows {len(heads)} != owned repository count {owned}')
          if checkpoint['capture_kind'] != 'contemporary':
              raise SystemExit('capture kind drifted from contemporary')
          if checkpoint['date'] != '2026-08-15':
              raise SystemExit('checkpoint date drifted')
          if checkpoint['delta']['status'] != 'previous_checkpoint_not_materialized':
              raise SystemExit('unexpected predecessor delta promotion; Aug 10 was not verified/materialized at capture start')
          print(f'validated owned_repository_count={owned} canonical_head_rows={len(heads)}')
          PY

      - name: Bind exact checkpoint bytes and build durable snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p machine/trajectory/receipts docs/trajectory/snapshots
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          checkpoint_path = Path('machine/trajectory/checkpoints/2026-08-15.json')
          receipt_path = Path('machine/trajectory/receipts/2026-08-15.sha256')
          snapshot_path = Path('docs/trajectory/snapshots/2026-08-15.md')
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8'))
          exact_sha = hashlib.sha256(checkpoint_path.read_bytes()).hexdigest()
          receipt_path.write_text(f'{exact_sha}  {checkpoint_path.as_posix()}\n', encoding='utf-8')

          inventory = checkpoint['state']['repository_inventory']
          heads = checkpoint['state']['canonical_heads']
          non_null_heads = sum(1 for row in heads if row.get('head_sha'))
          null_heads = len(heads) - non_null_heads

          dossiers_path = Path('manifests/company_dossiers.json')
          company_count = None
          if dossiers_path.exists():
              dossiers = json.loads(dossiers_path.read_text(encoding='utf-8'))
              company_count = len(dossiers.get('required_company_tracks', []))

          topology_path = Path('manifests/company_analysis_topology.json')
          topology = json.loads(topology_path.read_text(encoding='utf-8')) if topology_path.exists() else {}

          atlas_delta_path = Path('status/estate_evolution/2026-08-15-atlas-live-delta.json')
          atlas_delta = json.loads(atlas_delta_path.read_text(encoding='utf-8')) if atlas_delta_path.exists() else {}
          created_delta = atlas_delta.get('discovery', {}).get('newly_created_visible_count')

          lines = [
              '# GlacierEQ Estate Trajectory Snapshot — 2026-08-15 HST',
              '',
              f"- Capture time: `{checkpoint['captured_at_hst']}`",
              f"- Phase: `{checkpoint['phase']}`",
              f"- Resolution: `{checkpoint['resolution']}`",
              f"- Authority: `{checkpoint['authority']['repository']}`",
              f"- Exact checkpoint file SHA-256: `{exact_sha}`",
              '',
              '## Authenticated estate state',
              '',
              f"- Owned repositories: **{inventory['owned_repository_count']}**",
              f"- Visibility counts: `{json.dumps(inventory['visibility_counts'], sort_keys=True)}`",
              f"- Active: **{inventory['active_count']}**; archived: **{inventory['archived_count']}**",
              f"- Native: **{inventory['native_count']}**; forks: **{inventory['fork_count']}**",
              f"- Canonical default-branch rows: **{len(heads)}**",
              f"- Resolved exact default-branch commit heads: **{non_null_heads}**",
              f"- Repositories with no resolvable default-branch commit: **{null_heads}**",
              '',
              '## Trajectory state',
              '',
              f"- Delta status: `{checkpoint['delta']['status']}`",
              f"- Previous checkpoint expected: `{checkpoint['delta']['previous_checkpoint_expected']}`",
              '- No August 10 delta is fabricated. The verified August 10 reconstruction was not materialized when this capture began.',
              f"- Required company tracks in the current Helix dossier authority: **{company_count if company_count is not None else 'unresolved'}**",
              f"- Authenticated bounded repositories created since the Aug 14 Atlas receipt: **{created_delta if created_delta is not None else 'unresolved'}**. This is not promoted as a full-estate delta.",
              '',
              '## Company-analysis topology',
              '',
              f"- Mission orchestrator: `{topology.get('mission_orchestrator', {}).get('id', 'unresolved')}`",
              f"- Specialist lanes: **{len(topology.get('specialists', []))}**",
              f"- Wave size: **{topology.get('wave_size', 'unresolved')}**",
              '- Planning is explicitly not execution, model consensus, company affiliation, or runtime proof.',
              '',
              '## Evidence dimensions',
              '',
          ]
          for name, state in sorted(checkpoint['state']['dimensions'].items()):
              lines.append(f"- `{name}`: files={state['file_count']}, tree_sha256=`{state['tree_sha256']}`, sources={state['sources']}")
          lines += [
              '',
              '## Boundaries and blockers',
              '',
              '- Full-estate repository truth comes from authenticated owner enumeration; public-only inventory is not substituted.',
              '- Company naming and repository ownership do not establish affiliation or authorship.',
              '- Semantic relevance across the full estate remains continuing review where the dossier authority says it is incomplete.',
              '- Historical source truth is not overwritten by this contemporary preservation branch.',
              '',
              '## Exact-byte receipt',
              '',
              f"`{exact_sha}  machine/trajectory/checkpoints/2026-08-15.json`",
              '',
          ]
          snapshot_path.write_text('\n'.join(lines), encoding='utf-8')
          print(f'exact_checkpoint_sha256={exact_sha}')
          PY

      - name: Preserve exact snapshot and remove one-time trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/trajectory-capture-2026-08-15-once.yml
          git add machine/trajectory/checkpoints/2026-08-15.json \
                  machine/trajectory/receipts/2026-08-15.sha256 \
                  docs/trajectory/snapshots/2026-08-15.md
          git commit -m 'chore(trajectory): preserve 2026-08-15 exact snapshot'
          git push origin HEAD:trajectory-captures-2026

      - name: Upload durable exact checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-checkpoint-2026-08-15-${{ github.run_id }}
          path: |
            machine/trajectory/checkpoints/2026-08-15.json
            machine/trajectory/receipts/2026-08-15.sha256
            docs/trajectory/snapshots/2026-08-15.md
          if-no-files-found: error
          retention-days: 90
