name: Portfolio Live Freshness

on:
  push:
    branches: [main]
    paths:
      - "manifests/portfolio_repositories.json"
      - "manifests/live_repository_evidence.json"
      - "manifests/flagship_registry.json"
      - "manifests/flagship_external_repositories.json"
      - "manifests/company_dossiers.json"
      - "manifests/company_dossiers/**"
      - "scripts/audit_live_portfolio_freshness.py"
      - "tests/test_live_portfolio_freshness.py"
      - ".github/workflows/portfolio-live-freshness.yml"
  pull_request:
    paths:
      - "manifests/portfolio_repositories.json"
      - "manifests/live_repository_evidence.json"
      - "manifests/flagship_registry.json"
      - "manifests/flagship_external_repositories.json"
      - "manifests/company_dossiers.json"
      - "manifests/company_dossiers/**"
      - "scripts/audit_live_portfolio_freshness.py"
      - "tests/test_live_portfolio_freshness.py"
      - ".github/workflows/portfolio-live-freshness.yml"
  schedule:
    - cron: "43 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-live-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-auditor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Compile auditor
        run: python -m py_compile scripts/audit_live_portfolio_freshness.py
      - name: Run freshness regression tests
        run: python -m pytest -q tests/test_live_portfolio_freshness.py

  observe-live-estate:
    needs: verify-auditor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit live portfolio metadata and evidence freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTFOLIO_AUDIT_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_AUDIT_GITHUB_TOKEN }}
        run: |
          python scripts/audit_live_portfolio_freshness.py \
            --write-receipt artifacts/portfolio-live-freshness.json
      - name: Verify receipt structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('artifacts/portfolio-live-freshness.json').read_text())
          assert receipt['schema'] == 'glaciereq.portfolio-live-freshness-receipt.v1'
          assert receipt['mutation'] == 'NONE'
          assert receipt['portfolio']['flagships'] > 0
          assert 'findings' in receipt
          assert receipt['receipt_sha256']
          print(json.dumps(receipt['freshness'], indent=2, sort_keys=True))
          PY
      - name: Upload freshness receipt
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-live-freshness-${{ github.sha }}
          path: artifacts/portfolio-live-freshness.json
          if-no-files-found: error
          retention-days: 30
