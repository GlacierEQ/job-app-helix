name: Materialize 48-Track Intelligence

on:
  push:
    branches:
      - hard-reset/48-track-diamond-gatling-2026-08-05
    paths:
      - .github/workflows/materialize-48-track-intelligence.yml

permissions:
  contents: write

concurrency:
  group: materialize-48-track-intelligence
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated Helix branch
        uses: actions/checkout@v4
        with:
          ref: hard-reset/48-track-diamond-gatling-2026-08-05
          fetch-depth: 0

      - name: Download and verify immutable bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            'https://kjebemdgvjvuutzvhbtp.supabase.co/functions/v1/helix48-bundle' \
            --output /tmp/helix48.tar.xz
          echo '2875b3edafd6349d8160930c30f662654158e15e783c27fc1fb7efc0dd6a2564  /tmp/helix48.tar.xz' | sha256sum --check --strict
          test "$(stat -c%s /tmp/helix48.tar.xz)" = '33516'

      - name: Materialize intelligence plane
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/helix48.tar.xz -C .
          python scripts/validate_company_intelligence.py
          python -m pytest -q tests/test_company_intelligence.py

      - name: Commit validated artifacts and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-48-track-intelligence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/48_TRACK_BOTTLENECK_ATLAS.md \
            docs/48-track-bottleneck-atlas-*.md \
            manifests/company_intelligence.json \
            manifests/application_intelligence \
            receipts/company-intelligence-validation-2026-08-05.json \
            src/job_app_helix/company_intelligence.py \
            scripts/run_gatling_tsunami.py \
            scripts/validate_company_intelligence.py \
            tests/test_company_intelligence.py \
            .github/workflows/materialize-48-track-intelligence.yml
          git diff --cached --check
          git commit -m 'feat: integrate 48-track bottleneck intelligence'
          git push origin HEAD:hard-reset/48-track-diamond-gatling-2026-08-05
