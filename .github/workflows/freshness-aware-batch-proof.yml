name: Freshness Aware Batch Proof
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - 'src/job_app_helix/freshness_aware_batch.py'
      - 'tests/test_freshness_aware_batch.py'
      - '.github/workflows/freshness-aware-batch-proof.yml'
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Ruff focused runtime
        run: python -m ruff check src/job_app_helix/freshness_aware_batch.py tests/test_freshness_aware_batch.py
      - name: Stale packet rebuild adversarial proof
        run: python -m pytest -q tests/test_freshness_aware_batch.py tests/test_batch_application_execution.py
      - name: Executable module resolution
        run: python -m job_app_helix.freshness_aware_batch --help
