name: Proof-weighted portfolio audit

on:
  push:
    branches:
      - audit/proof-weighted-portfolio-2026-07-29
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-verification:
    name: "Python · ${{ matrix.name }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: job-app-helix, repository: GlacierEQ/job-app-helix, ref: audit/proof-weighted-portfolio-2026-07-29}
          - {name: AKOS, repository: GlacierEQ/AKOS, ref: main}
          - {name: spacex-telemetry, repository: GlacierEQ/spacex-telemetry, ref: main}
          - {name: spacex-propulsion-monitor, repository: GlacierEQ/spacex-propulsion-monitor, ref: main}
          - {name: spacex-ground-network, repository: GlacierEQ/spacex-ground-network, ref: main}
          - {name: spacex-launch-sequencer, repository: GlacierEQ/spacex-launch-sequencer, ref: main}
          - {name: spacex-mission-control, repository: GlacierEQ/spacex-mission-control, ref: main}
          - {name: spacex-satellite-mesh, repository: GlacierEQ/spacex-satellite-mesh, ref: main}
          - {name: spacex-autonomy, repository: GlacierEQ/spacex-autonomy, ref: main}
          - {name: spacex-cryogenics, repository: GlacierEQ/spacex-cryogenics, ref: main}
          - {name: spacex-conjunction-sentinel, repository: GlacierEQ/spacex-conjunction-sentinel, ref: main}
          - {name: spacex-pad-weather-gate, repository: GlacierEQ/spacex-pad-weather-gate, ref: main}
          - {name: spacex-orbital-mechanics, repository: GlacierEQ/spacex-orbital-mechanics, ref: main}
          - {name: spacex-thermal-protection, repository: GlacierEQ/spacex-thermal-protection, ref: main}
          - {name: anthropic-agent-coordinator, repository: GlacierEQ/anthropic-agent-coordinator, ref: master}
          - {name: anthropic-safety-monitor, repository: GlacierEQ/anthropic-safety-monitor, ref: master}
          - {name: xai-colossus-cooling-alpha, repository: GlacierEQ/xai-colossus-cooling-alpha, ref: master}
          - {name: xai-colossus-cooling-omega, repository: GlacierEQ/xai-colossus-cooling-omega, ref: master}
          - {name: xai-colossus-energy-alpha, repository: GlacierEQ/xai-colossus-energy-alpha, ref: master}
          - {name: xai-colossus-energy-omega, repository: GlacierEQ/xai-colossus-energy-omega, ref: master}
          - {name: xai-colossus-servers, repository: GlacierEQ/xai-colossus-servers, ref: main}
          - {name: the-tower-of-babel, repository: GlacierEQ/the-tower-of-babel, ref: build/canonical-executable-tower}
          - {name: Megamind, repository: GlacierEQ/Pro-Mastermind, ref: recovery/pristine-model-vault-wave2}
    steps:
      - name: Check out audit engine
        uses: actions/checkout@v4
        with:
          repository: GlacierEQ/job-app-helix
          ref: audit/proof-weighted-portfolio-2026-07-29
          path: audit

      - name: Check out audited repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded audit dependency
        run: python -m pip install --upgrade pip pytest

      - name: Execute bounded Python verification contract
        run: |
          python audit/scripts/run_featured_verification.py \
            --name '${{ matrix.name }}' \
            --repository '${{ matrix.repository }}' \
            --ref '${{ matrix.ref }}' \
            --path target \
            --surface python \
            --output audit-result.json \
            --log audit.log

      - name: Upload audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: audit-python-${{ matrix.name }}
          path: |
            audit-result.json
            audit.log
          if-no-files-found: error

      - name: Reflect verification result
        shell: bash
        run: |
          status="$(jq -r '.status' audit-result.json)"
          if [[ "$status" == "FAILED" || "$status" == "INVALID_CONTRACT" ]]; then exit 1; fi

  native-verification:
    name: "Native · ${{ matrix.name }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: telemetry-go, repository: GlacierEQ/spacex-telemetry, ref: main, technology: Go}
          - {name: autonomy-go, repository: GlacierEQ/spacex-autonomy, ref: main, technology: Go}
          - {name: launch-sequencer-go, repository: GlacierEQ/spacex-launch-sequencer, ref: main, technology: Go}
          - {name: pad-weather-go, repository: GlacierEQ/spacex-pad-weather-gate, ref: main, technology: Go}
          - {name: orbital-cpp, repository: GlacierEQ/spacex-orbital-mechanics, ref: main, technology: C++}
          - {name: thermal-odin, repository: GlacierEQ/spacex-thermal-protection, ref: main, technology: Odin}
    steps:
      - name: Check out audit engine
        uses: actions/checkout@v4
        with:
          repository: GlacierEQ/job-app-helix
          ref: audit/proof-weighted-portfolio-2026-07-29
          path: audit

      - name: Check out audited repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        if: matrix.technology == 'Go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Execute bounded native verification contract
        run: |
          python audit/scripts/run_featured_verification.py \
            --name '${{ matrix.name }}' \
            --repository '${{ matrix.repository }}' \
            --ref '${{ matrix.ref }}' \
            --path target \
            --surface native \
            --output audit-result.json \
            --log audit.log

      - name: Upload native audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: audit-native-${{ matrix.name }}
          path: |
            audit-result.json
            audit.log
          if-no-files-found: error

      - name: Reflect native failure
        shell: bash
        run: |
          status="$(jq -r '.status' audit-result.json)"
          if [[ "$status" == "FAILED" || "$status" == "INVALID_CONTRACT" ]]; then exit 1; fi
