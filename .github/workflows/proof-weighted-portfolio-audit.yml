name: Proof-weighted portfolio audit

on:
  push:
    branches:
      - audit/proof-weighted-portfolio-2026-07-29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-verification:
    name: "Python · ${{ matrix.name }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: job-app-helix
            repository: GlacierEQ/job-app-helix
            ref: audit/proof-weighted-portfolio-2026-07-29
            command: python -m pip install -e '.[dev]' && python -m pytest -q
          - name: AKOS
            repository: GlacierEQ/AKOS
            ref: main
            command: python -m pytest -q
          - name: spacex-telemetry
            repository: GlacierEQ/spacex-telemetry
            ref: main
            command: python -m pytest -q
          - name: spacex-propulsion-monitor
            repository: GlacierEQ/spacex-propulsion-monitor
            ref: main
            command: python -m pytest -q
          - name: spacex-ground-network
            repository: GlacierEQ/spacex-ground-network
            ref: main
            command: python -m pytest -q
          - name: spacex-launch-sequencer
            repository: GlacierEQ/spacex-launch-sequencer
            ref: main
            command: python -m pytest -q
          - name: spacex-mission-control
            repository: GlacierEQ/spacex-mission-control
            ref: main
            command: python -m pytest -q
          - name: spacex-satellite-mesh
            repository: GlacierEQ/spacex-satellite-mesh
            ref: main
            command: python -m pytest -q
          - name: spacex-autonomy
            repository: GlacierEQ/spacex-autonomy
            ref: main
            command: python -m pytest -q
          - name: spacex-cryogenics
            repository: GlacierEQ/spacex-cryogenics
            ref: main
            command: python -m pytest -q
          - name: spacex-conjunction-sentinel
            repository: GlacierEQ/spacex-conjunction-sentinel
            ref: main
            command: python -m pytest -q
          - name: spacex-pad-weather-gate
            repository: GlacierEQ/spacex-pad-weather-gate
            ref: main
            command: python -m pytest -q
          - name: spacex-orbital-mechanics
            repository: GlacierEQ/spacex-orbital-mechanics
            ref: main
            command: python -m pytest -q
          - name: spacex-thermal-protection
            repository: GlacierEQ/spacex-thermal-protection
            ref: main
            command: python -m pytest -q
          - name: anthropic-agent-coordinator
            repository: GlacierEQ/anthropic-agent-coordinator
            ref: master
            command: python -m pytest -q
          - name: anthropic-safety-monitor
            repository: GlacierEQ/anthropic-safety-monitor
            ref: master
            command: python -m pytest -q
          - name: xai-colossus-cooling-alpha
            repository: GlacierEQ/xai-colossus-cooling-alpha
            ref: master
            command: python -m pytest -q
          - name: xai-colossus-cooling-omega
            repository: GlacierEQ/xai-colossus-cooling-omega
            ref: master
            command: python -m pytest -q
          - name: xai-colossus-energy-alpha
            repository: GlacierEQ/xai-colossus-energy-alpha
            ref: master
            command: python -m pytest -q
          - name: xai-colossus-energy-omega
            repository: GlacierEQ/xai-colossus-energy-omega
            ref: master
            command: python -m pytest -q
          - name: xai-colossus-servers
            repository: GlacierEQ/xai-colossus-servers
            ref: main
            command: python -m pytest -q
          - name: the-tower-of-babel
            repository: GlacierEQ/the-tower-of-babel
            ref: build/canonical-executable-tower
            command: python -m pip install -e '.[dev]' && python -m pytest -q && tower validate && tower generate --check
          - name: Megamind
            repository: GlacierEQ/Pro-Mastermind
            ref: recovery/pristine-model-vault-wave2
            command: python -m pip install -e '.[dev]' && python -m pytest -q && megamind validate
    steps:
      - name: Check out audited repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit runner
        run: python -m pip install --upgrade pip pytest

      - name: Execute advertised Python verification path
        id: verify
        working-directory: target
        shell: bash
        run: |
          set +e
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash -lc "${{ matrix.command }}" > ../audit.log 2>&1
          exit_code=$?
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - "$exit_code" "$started" "$finished" <<'PY'
          import json, pathlib, sys
          exit_code = int(sys.argv[1])
          payload = {
              "repository": "${{ matrix.repository }}",
              "ref": "${{ matrix.ref }}",
              "surface": "python",
              "command": "${{ matrix.command }}",
              "exit_code": exit_code,
              "status": "VERIFIED" if exit_code == 0 else "FAILED",
              "started_at": sys.argv[2],
              "finished_at": sys.argv[3],
          }
          pathlib.Path("../audit-result.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          cat ../audit.log
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: audit-python-${{ matrix.name }}
          path: |
            audit-result.json
            audit.log
          if-no-files-found: error

      - name: Reflect verification result
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1

  native-verification:
    name: "Native · ${{ matrix.name }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: telemetry-go
            repository: GlacierEQ/spacex-telemetry
            ref: main
            technology: Go
            command: go run src/telemetry_decoder.go
          - name: autonomy-go
            repository: GlacierEQ/spacex-autonomy
            ref: main
            technology: Go
            command: go run src/flight_fsm.go
          - name: launch-sequencer-go
            repository: GlacierEQ/spacex-launch-sequencer
            ref: main
            technology: Go
            command: go run src/countdown_timer.go
          - name: pad-weather-go
            repository: GlacierEQ/spacex-pad-weather-gate
            ref: main
            technology: Go
            command: GO111MODULE=off go test src/electric_field_monitor.go
          - name: orbital-cpp
            repository: GlacierEQ/spacex-orbital-mechanics
            ref: main
            technology: C++
            command: g++ -std=c++17 -Wall -Wextra -pedantic src/lambert_solver.cpp -o /tmp/lambert && /tmp/lambert
          - name: thermal-odin
            repository: GlacierEQ/spacex-thermal-protection
            ref: main
            technology: Odin
            command: command -v odin >/dev/null && odin check src
    steps:
      - name: Check out audited repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: target

      - name: Set up Go
        if: matrix.technology == 'Go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Execute native verification path
        id: verify
        working-directory: target
        shell: bash
        run: |
          set +e
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "${{ matrix.technology }}" == "Odin" ]] && ! command -v odin >/dev/null 2>&1; then
            status="BLOCKED_TOOLCHAIN"
            exit_code=127
            printf 'Odin compiler is not installed on ubuntu-latest.\n' > ../audit.log
          else
            bash -lc "${{ matrix.command }}" > ../audit.log 2>&1
            exit_code=$?
            if [[ "$exit_code" -eq 0 ]]; then status="VERIFIED"; else status="FAILED"; fi
          fi
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - "$exit_code" "$status" "$started" "$finished" <<'PY'
          import json, pathlib, sys
          payload = {
              "repository": "${{ matrix.repository }}",
              "ref": "${{ matrix.ref }}",
              "surface": "native:${{ matrix.technology }}",
              "command": "${{ matrix.command }}",
              "exit_code": int(sys.argv[1]),
              "status": sys.argv[2],
              "started_at": sys.argv[3],
              "finished_at": sys.argv[4],
          }
          pathlib.Path("../audit-result.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          cat ../audit.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload native audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: audit-native-${{ matrix.name }}
          path: |
            audit-result.json
            audit.log
          if-no-files-found: error

      - name: Reflect native failure
        if: steps.verify.outputs.status == 'FAILED'
        run: exit 1
