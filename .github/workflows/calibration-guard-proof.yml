name: Calibration Guard Proof

on:
  pull_request:
    paths:
      - "src/job_app_helix/calibration_guard.py"
      - "src/job_app_helix/intelligence_cycle.py"
      - "tests/test_calibration_guard.py"
      - "tests/test_intelligence_cycle.py"
      - ".github/workflows/calibration-guard-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint guard and integration surface
        run: python -m ruff check src/job_app_helix/calibration_guard.py src/job_app_helix/intelligence_cycle.py tests/test_calibration_guard.py tests/test_intelligence_cycle.py
      - name: Prove fallback and cycle integration
        run: python -m pytest -q tests/test_calibration_guard.py tests/test_intelligence_cycle.py
      - name: Prove cycle remains executable
        run: python -m job_app_helix.intelligence_cycle --help >/dev/null
