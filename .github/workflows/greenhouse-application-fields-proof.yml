name: Greenhouse Application Fields Proof

on:
  pull_request:
    paths:
      - 'src/job_app_helix/greenhouse_application_fields.py'
      - 'tests/test_greenhouse_application_fields.py'
      - 'pyproject.toml'
      - '.github/workflows/greenhouse-application-fields-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-fields:
    name: Application fields / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and proof tools
        run: python -m pip install -e '.[dev]'
      - name: Lint application-field surface
        run: ruff check src/job_app_helix/greenhouse_application_fields.py tests/test_greenhouse_application_fields.py
      - name: Run adversarial application-field tests
        run: pytest tests/test_greenhouse_application_fields.py
      - name: Prove installed executable
        run: job-app-helix-greenhouse-fields --help
      - name: Observe live xAI Greenhouse application schema
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          cat > /tmp/proof-profile.json <<'JSON'
          {
            "profile_id": "live-schema-proof",
            "name": "Proof Candidate",
            "headline": "Schema proof only",
            "summary": "Non-submission live provider schema proof.",
            "skills": ["Python"],
            "experience": ["Provider schema validation"],
            "achievements": ["No external submission performed"],
            "contact": {"email": "proof@example.com"},
            "source_digest": "live-schema-proof"
          }
          JSON
          job-app-helix-greenhouse-fields \
            --board-key xai \
            --job-id 4956028007 \
            --profile /tmp/proof-profile.json \
            --output /tmp/xai-fields.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/xai-fields.json').read_text())
          assert payload['job_id'] == '4956028007'
          assert payload['fields'], 'live xAI job returned no application fields'
          assert payload['receipt_sha256']
          print(json.dumps({
              'job_id': payload['job_id'],
              'field_count': len(payload['fields']),
              'auto_fill_count': payload['auto_fill_count'],
              'attachment_count': payload['attachment_count'],
              'review_required_count': payload['review_required_count'],
              'receipt_sha256': payload['receipt_sha256'],
          }, sort_keys=True))
          PY
