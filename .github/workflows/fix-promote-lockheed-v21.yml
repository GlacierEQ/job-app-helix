name: Fix Lockheed V21 Promoter

on:
  push:
    branches:
      - second-depth/lockheed-v21-complete
    paths:
      - .github/workflows/fix-promote-lockheed-v21.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: second-depth/lockheed-v21-complete
      - name: Make baseline replacement cover both assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('.github/workflows/promote-lockheed-v21.yml')
          text = path.read_text()
          pattern = re.compile(
              r'''('self\.assertEqual\(result\["stage_counts"\]\["CLAIM_PROMOTED"\], 1\)',\n)\s*1,\n(\s*\))'''
          )
          text, count = pattern.subn(r'\1\2', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one replacement-count block, found {count}')
          path.write_text(text)
          PY
          git config user.name casey
          git config user.email GLACIER.EQUILIBRIUM@GMAIL.COM
          git add .github/workflows/promote-lockheed-v21.yml
          git commit -m 'ci: fix V21 Lockheed baseline test migration'
          git push origin HEAD:second-depth/lockheed-v21-complete
