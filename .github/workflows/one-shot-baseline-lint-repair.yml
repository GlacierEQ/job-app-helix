name: One-shot baseline lint repair

on:
  push:
    branches:
      - repair/helix-baseline-lint-20260807
    paths:
      - .github/workflows/one-shot-baseline-lint-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/helix-baseline-lint-20260807
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.16.1'
      - name: Format only known baseline debt files
        run: |
          ruff format \
            scripts/validate_portfolio_root_truth.py \
            src/job_app_helix/branch_steward.py \
            src/job_app_helix/library_cli.py
          ruff check --fix \
            scripts/validate_portfolio_root_truth.py \
            src/job_app_helix/branch_steward.py \
            src/job_app_helix/library_cli.py
          ruff check \
            scripts/validate_portfolio_root_truth.py \
            src/job_app_helix/branch_steward.py \
            src/job_app_helix/library_cli.py
      - name: Commit bounded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/validate_portfolio_root_truth.py \
            src/job_app_helix/branch_steward.py \
            src/job_app_helix/library_cli.py
          if git diff --cached --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git commit -m 'style(ci): repair baseline Ruff debt'
          git push origin HEAD:repair/helix-baseline-lint-20260807
