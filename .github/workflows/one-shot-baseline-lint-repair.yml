name: One-shot baseline lint repair

on:
  push:
    branches:
      - repair/helix-baseline-lint-20260807
    paths:
      - .github/workflows/one-shot-baseline-lint-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/helix-baseline-lint-20260807
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.16.1'
      - name: Repair only known baseline lint debt
        run: |
          set -euo pipefail
          targets=(
            scripts/validate_portfolio_root_truth.py
            src/job_app_helix/branch_steward.py
            src/job_app_helix/library_cli.py
          )
          ruff format "${targets[@]}"
          ruff check --fix "${targets[@]}" || true
          python - <<'PY'
          from pathlib import Path

          root = Path('scripts/validate_portfolio_root_truth.py')
          text = root.read_text(encoding='utf-8')
          replacements = {
              'f"{repository}: public L0 record has unsafe promotion state {promotion_state}",': (
                  'f"{repository}: public L0 record has unsafe "\n'
                  '                            f"promotion state {promotion_state}",'
              ),
              'f"HELIX_ADMITTED repository is absent from canonical inventory: {repository}",': (
                  'f"HELIX_ADMITTED repository is absent from "\n'
                  '                            f"canonical inventory: {repository}",'
              ),
              '"Root-truth projection validates control-plane source integrity only. Each downstream consumer must emit its own current-source receipt before release.",': (
                  '"Root-truth projection validates control-plane source integrity only. "\n'
                  '                "Each downstream consumer must emit its own current-source receipt before release.",'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected root-truth lint target: {old}')
              text = text.replace(old, new, 1)
          root.write_text(text, encoding='utf-8')

          steward = Path('src/job_app_helix/branch_steward.py')
          text = steward.read_text(encoding='utf-8')
          old = '"branch is behind canonical and still contains unique patches; synthesize its useful delta "'
          new = (
              '"branch is behind canonical and still contains unique patches; "\n'
              '            "synthesize its useful delta "'
          )
          if old not in text:
              raise SystemExit('missing expected branch-steward lint target')
          steward.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format "${targets[@]}"
          ruff check "${targets[@]}"
      - name: Commit bounded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/validate_portfolio_root_truth.py \
            src/job_app_helix/branch_steward.py \
            src/job_app_helix/library_cli.py
          if git diff --cached --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git commit -m 'style(ci): repair baseline Ruff debt'
          git push origin HEAD:repair/helix-baseline-lint-20260807
