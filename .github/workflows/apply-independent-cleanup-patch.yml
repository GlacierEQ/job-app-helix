name: Apply independent cleanup transaction patch

on:
  push:
    branches:
      - fix/independent-cleanup-transactions-2026-07-30
    paths:
      - ".github/workflows/apply-independent-cleanup-patch.yml"

permissions:
  contents: write

concurrency:
  group: independent-cleanup-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply exact cleanup transaction repair
        run: python scripts/apply_independent_cleanup_patch.py

      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"

      - name: Run focused cleanup tests
        run: python -m pytest -q tests/test_obsolete_branch_cleanup.py

      - name: Run strict lint on repaired surfaces
        run: ruff check scripts/cleanup_obsolete_branches.py tests/test_obsolete_branch_cleanup.py

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_independent_cleanup_patch.py
          rm .github/workflows/apply-independent-cleanup-patch.yml

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cleanup_obsolete_branches.py tests/test_obsolete_branch_cleanup.py \
            scripts/apply_independent_cleanup_patch.py \
            .github/workflows/apply-independent-cleanup-patch.yml
          git commit -m "fix: isolate branch retirement transactions"
          git push origin HEAD:${GITHUB_REF_NAME}
