name: Greenhouse Application Finalization Proof
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "src/job_app_helix/greenhouse_application_finalization.py"
      - "tests/test_greenhouse_application_finalization.py"
      - "pyproject.toml"
      - ".github/workflows/greenhouse-application-finalization-proof.yml"

jobs:
  finalization:
    name: Finalization / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and proof tools
        run: python -m pip install -e '.[dev]'
      - name: Lint finalization surface
        run: >-
          ruff check
          src/job_app_helix/greenhouse_application_finalization.py
          tests/test_greenhouse_application_finalization.py
      - name: Run adversarial finalization tests
        run: pytest tests/test_greenhouse_application_finalization.py
      - name: Prove installed executable
        run: job-app-helix-greenhouse-finalize --help
