name: Estate Intelligence Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-intelligence-compiler
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OWNER_CENSUS_TOKEN: ${{ secrets.OWNER_CENSUS_TOKEN }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and verification tools
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"

      - name: Verify compiler contracts
        run: >-
          python -m pytest -q
          tests/test_estate_projection_compiler.py
          tests/test_estate_role_intelligence.py
          tests/test_compiled_recruiter_site.py

      - name: Require exact owner-census authority
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OWNER_CENSUS_TOKEN:-}" ]; then
            echo "OWNER_CENSUS_TOKEN is required for the complete private owner estate."
            exit 1
          fi

      - name: Census complete owner estate
        run: >-
          python scripts/census_owned_library.py
          --owner GlacierEQ
          --token "$OWNER_CENSUS_TOKEN"
          --output /tmp/owned-library-census.json

      - name: Compile internal registries and public projection
        run: >-
          python scripts/compile_estate_projection.py
          --census /tmp/owned-library-census.json
          --output /tmp/estate-intelligence

      - name: Enforce public privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          public_path = Path("/tmp/estate-intelligence/public_projection.json")
          build_path = Path("/tmp/estate-intelligence/build_manifest.json")
          payload = json.loads(public_path.read_text(encoding="utf-8"))
          forbidden = {
              "repository_count",
              "native_repository_count",
              "fork_repository_count",
              "private_repository_count",
              "unresolved_native_repository_count",
          }

          def walk(value, path="$"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in forbidden:
                          raise SystemExit(f"forbidden public key {path}.{key}")
                      walk(child, f"{path}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{path}[{index}]")

          walk(payload)
          boundary = payload.get("truth_boundary", {})
          required = (
              "private_repository_identities_omitted",
              "restricted_namespaces_omitted",
              "native_estate_cardinality_intentionally_not_published",
          )
          missing = [key for key in required if boundary.get(key) is not True]
          if missing:
              raise SystemExit(f"public boundary missing {missing}")
          if not build_path.is_file():
              raise SystemExit("build manifest missing")
          PY
          test ! -e artifacts/owned-library-census.json
          test ! -e artifacts/estate-intelligence/canonical_system_registry.json

      - name: Stage only public-safe compiler artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/estate-intelligence-public
          cp /tmp/estate-intelligence/public_projection.json \
            artifacts/estate-intelligence-public/public_projection.json
          cp /tmp/estate-intelligence/build_manifest.json \
            artifacts/estate-intelligence-public/build_manifest.json

      - name: Upload public compiler artifacts
        uses: actions/upload-artifact@v4
        with:
          name: estate-intelligence-public-${{ github.sha }}
          path: artifacts/estate-intelligence-public
          if-no-files-found: error
          retention-days: 7
