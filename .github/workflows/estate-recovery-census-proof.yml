name: Estate Recovery Census Proof

on:
  pull_request:
    paths:
      - "src/job_app_helix/estate_recovery_census.py"
      - "tests/test_estate_recovery_census.py"
      - "pyproject.toml"
      - ".github/workflows/estate-recovery-census-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/job_app_helix/estate_recovery_census.py"
      - "tests/test_estate_recovery_census.py"
      - "pyproject.toml"
      - ".github/workflows/estate-recovery-census-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    name: Estate recovery / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and proof tools
        run: python -m pip install -e ".[dev]"

      - name: Lint recovered executable surface
        run: >-
          ruff check
          src/job_app_helix/estate_recovery_census.py
          tests/test_estate_recovery_census.py

      - name: Run adversarial recovery census tests
        run: python -m pytest -q tests/test_estate_recovery_census.py

      - name: Prove installed executable
        run: job-app-helix-estate-recovery --help
