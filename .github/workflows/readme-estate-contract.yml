name: README Estate Contract

on:
  push:
    branches: [main]
    paths:
      - "src/job_app_helix/readme_estate.py"
      - "src/job_app_helix/readme_estate_cli.py"
      - "src/job_app_helix/readme_four_depth.py"
      - "src/job_app_helix/readme_license.py"
      - "tests/test_readme_estate.py"
      - "tests/test_readme_estate_cli.py"
      - "tests/test_readme_four_depth.py"
      - "schemas/readme_machine_mesh.schema.json"
      - "docs/README_ESTATE_STANDARD.md"
      - "docs/README_OPTIMAL_IMPACT_FRAME.md"
      - "LICENSE"
      - "LICENSE_POLICY.json"
      - "THIRD_PARTY_NOTICES.md"
      - "pyproject.toml"
      - ".github/workflows/readme-estate-contract.yml"
  pull_request:
    paths:
      - "src/job_app_helix/readme_estate.py"
      - "src/job_app_helix/readme_estate_cli.py"
      - "src/job_app_helix/readme_four_depth.py"
      - "src/job_app_helix/readme_license.py"
      - "tests/test_readme_estate.py"
      - "tests/test_readme_estate_cli.py"
      - "tests/test_readme_four_depth.py"
      - "schemas/readme_machine_mesh.schema.json"
      - "docs/README_ESTATE_STANDARD.md"
      - "docs/README_OPTIMAL_IMPACT_FRAME.md"
      - "LICENSE"
      - "LICENSE_POLICY.json"
      - "THIRD_PARTY_NOTICES.md"
      - "pyproject.toml"
      - ".github/workflows/readme-estate-contract.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify README estate engine
        run: >-
          python -m pytest -q
          tests/test_readme_estate.py
          tests/test_readme_estate_cli.py
          tests/test_readme_four_depth.py
      - name: Compile README estate modules
        run: >-
          python -m py_compile
          src/job_app_helix/readme_estate.py
          src/job_app_helix/readme_estate_cli.py
          src/job_app_helix/readme_four_depth.py
          src/job_app_helix/readme_license.py
