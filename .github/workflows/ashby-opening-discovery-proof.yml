name: Ashby Opening Discovery Proof

on:
  pull_request:
    paths:
      - "src/job_app_helix/ashby_opening_discovery.py"
      - "src/job_app_helix/opening_watch.py"
      - "src/job_app_helix/opening_acquisition.py"
      - "tests/test_ashby_opening_discovery.py"
      - ".github/workflows/ashby-opening-discovery-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/job_app_helix/ashby_opening_discovery.py"
      - "src/job_app_helix/opening_watch.py"
      - "src/job_app_helix/opening_acquisition.py"
      - "tests/test_ashby_opening_discovery.py"
      - ".github/workflows/ashby-opening-discovery-proof.yml"

permissions:
  contents: read

jobs:
  ashby-opening-discovery:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and proof tools
        run: python -m pip install -e '.[dev]'

      - name: Lint Ashby executable surface
        run: >-
          ruff check
          src/job_app_helix/ashby_opening_discovery.py
          tests/test_ashby_opening_discovery.py

      - name: Run adversarial Ashby discovery tests
        run: >-
          python -m pytest -q
          tests/test_ashby_opening_discovery.py
          tests/test_opening_watch.py

      - name: Prove executable module
        run: python -m job_app_helix.ashby_opening_discovery --help
