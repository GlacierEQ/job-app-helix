name: Candidate Profile Compiler Proof

on:
  pull_request:
    paths:
      - "src/job_app_helix/candidate_profile_compiler.py"
      - "tests/test_candidate_profile_compiler.py"
      - "pyproject.toml"
      - ".github/workflows/candidate-profile-compiler-proof.yml"
  workflow_dispatch:

jobs:
  proof:
    name: Candidate profile / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and proof tools
        run: python -m pip install -e ".[dev]"
      - name: Lint candidate profile surface
        run: >-
          ruff check --diff
          src/job_app_helix/candidate_profile_compiler.py
          tests/test_candidate_profile_compiler.py
      - name: Run adversarial profile compiler tests
        run: pytest tests/test_candidate_profile_compiler.py
      - name: Prove installed executable
        run: job-app-helix-profile --help
