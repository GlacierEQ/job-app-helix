name: Portfolio Root Truth

on:
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - "schemas/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/portfolio-root-truth.yml"
  pull_request:
    paths:
      - "manifests/**"
      - "schemas/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/portfolio-root-truth.yml"
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-root-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 jsonschema==4.25.1
      - name: Validate Draft 2020-12 schema
        run: python scripts/validate_portfolio_root_schema.py
      - name: Validate and write deterministic receipt
        run: python scripts/validate_portfolio_root_truth.py --write-receipt artifacts/portfolio-root-truth-receipt.json
      - name: Run root-truth regression tests
        run: python -m pytest -q tests/test_portfolio_root_truth.py
      - name: Verify receipt contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('artifacts/portfolio-root-truth-receipt.json').read_text())
          assert receipt['schema'] == 'glaciereq.portfolio-root-truth-receipt.v1'
          assert receipt['status'] == 'PASS'
          assert receipt['scope'] == 'CONTROL_PLANE_SOURCES_ONLY'
          inventory = json.loads(
              Path('manifests/portfolio_repositories.json').read_text()
          )
          workspace = inventory['workspace_repositories']
          assert isinstance(
              receipt['projection_freshness']['all_projections_current'], bool
          )
          assert inventory['total_repositories'] == len(workspace) + 1
          assert receipt['counts']['total_repositories'] == inventory[
              'total_repositories'
          ]
          assert receipt['counts']['workspace_repositories'] == len(workspace)
          assert all(receipt['invariants'].values())
          print(receipt['receipt_sha256'])
          PY
      - name: Upload root-truth receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-root-truth-receipt-${{ github.sha }}
          path: artifacts/portfolio-root-truth-receipt.json
          if-no-files-found: error
          retention-days: 30
