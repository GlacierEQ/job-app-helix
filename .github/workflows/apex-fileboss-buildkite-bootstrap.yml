name: APEX FILEBOSS Buildkite Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apex-fileboss-buildkite-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: apex-fileboss-buildkite-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
    steps:
      - name: Probe encrypted secret availability
        shell: bash
        run: |
          set -euo pipefail
          bk=absent
          dbx=absent
          [[ -n "${BUILDKITE_API_TOKEN:-}" ]] && bk=present
          [[ -n "${DROPBOX_ACCESS_TOKEN:-}" ]] && dbx=present
          printf '{"buildkite_api_token":"%s","dropbox_access_token":"%s"}\n' "$bk" "$dbx" | tee /tmp/secret-probe.json
          if [[ "$bk" != present ]]; then
            echo "::error::BUILDKITE_API_TOKEN is not exposed to job-app-helix."
            exit 64
          fi

      - name: Inspect Buildkite org and donor pipeline
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${BUILDKITE_API_TOKEN}" -H "Accept: application/json")
          curl -fsS "${auth[@]}" https://api.buildkite.com/v2/access-token > /tmp/token.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/token.json'))
          print(json.dumps({
            "authenticated": True,
            "uuid": d.get("uuid"),
            "description": d.get("description"),
            "expires_at": d.get("expires_at"),
            "scopes": sorted(d.get("scopes") or []),
          }, indent=2))
          PY

          curl -fsS "${auth[@]}" https://api.buildkite.com/v2/organizations/casey-1/pipelines/job-app-helix > /tmp/donor.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/donor.json'))
          print(json.dumps({
            "donor_slug": d.get("slug"),
            "cluster_id": d.get("cluster_id"),
            "repository": d.get("repository"),
          }, indent=2))
          PY

      - name: Create or reconcile FILEBOSS pipeline
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${BUILDKITE_API_TOKEN}" -H "Accept: application/json" -H "Content-Type: application/json")
          cluster_id="$(python3 -c 'import json; print(json.load(open("/tmp/donor.json")).get("cluster_id") or "")')"
          if [[ -z "$cluster_id" ]]; then
            echo "::error::Donor pipeline has no cluster_id; refusing to guess."
            exit 65
          fi

          cat > /tmp/pipeline.json <<JSON
          {
            "name": "FILEBOSS Evidence Transcription",
            "repository": "git@github.com:GlacierEQ/FILEBOSS.git",
            "cluster_id": "$cluster_id",
            "configuration": "steps:\n  - label: \":pipeline: Load FILEBOSS maintained pipeline\"\n    command: \"buildkite-agent pipeline upload .buildkite/pipeline.yml\"\n",
            "default_branch": "main",
            "branch_configuration": "main",
            "cancel_running_branch_builds": false,
            "skip_queued_branch_builds": false,
            "visibility": "private"
          }
          JSON

          curl -fsS "${auth[@]}" "https://api.buildkite.com/v2/organizations/casey-1/pipelines?per_page=100" > /tmp/pipelines.json
          slug="$(python3 - <<'PY'
          import json
          ps=json.load(open('/tmp/pipelines.json'))
          for p in ps:
              repo=(p.get('repository') or '').lower().replace('.git','')
              if repo.endswith('glaciereq/fileboss'):
                  print(p.get('slug') or '')
                  break
          PY
          )"

          if [[ -z "$slug" ]]; then
            curl -fsS "${auth[@]}" -X POST --data-binary @/tmp/pipeline.json https://api.buildkite.com/v2/organizations/casey-1/pipelines > /tmp/fileboss-pipeline.json
          else
            curl -fsS "${auth[@]}" -X PATCH --data-binary @/tmp/pipeline.json "https://api.buildkite.com/v2/organizations/casey-1/pipelines/$slug" > /tmp/fileboss-pipeline.json
          fi

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/fileboss-pipeline.json'))
          assert d.get('slug'), d
          print(json.dumps({
            "pipeline_slug": d.get("slug"),
            "pipeline_id": d.get("id"),
            "cluster_id": d.get("cluster_id"),
            "repository": d.get("repository"),
            "web_url": d.get("web_url"),
          }, indent=2))
          PY

      - name: Ensure Dropbox secret and trigger main
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${BUILDKITE_API_TOKEN}" -H "Accept: application/json" -H "Content-Type: application/json")
          slug="$(python3 -c 'import json; print(json.load(open("/tmp/fileboss-pipeline.json"))["slug"])')"
          cluster_id="$(python3 -c 'import json; print(json.load(open("/tmp/fileboss-pipeline.json"))["cluster_id"])')"

          curl -fsS "${auth[@]}" "https://api.buildkite.com/v2/organizations/casey-1/clusters/$cluster_id/secrets?per_page=100" > /tmp/secrets.json
          secret_id="$(python3 - <<'PY'
          import json
          for s in json.load(open('/tmp/secrets.json')):
              if s.get('key') == 'DROPBOX_ACCESS_TOKEN':
                  print(s.get('id') or '')
                  break
          PY
          )"

          if [[ -z "$secret_id" ]]; then
            if [[ -z "${DROPBOX_ACCESS_TOKEN:-}" ]]; then
              echo "::error::Buildkite cluster lacks DROPBOX_ACCESS_TOKEN and Helix has no Dropbox secret to provision it."
              exit 66
            fi
            python3 - <<'PY' > /tmp/secret-create.json
          import json, os
          print(json.dumps({
            "key":"DROPBOX_ACCESS_TOKEN",
            "value":os.environ["DROPBOX_ACCESS_TOKEN"],
            "description":"Dropbox corpus access for GlacierEQ/FILEBOSS evidence transcription",
          }))
          PY
            curl -fsS "${auth[@]}" -X POST --data-binary @/tmp/secret-create.json "https://api.buildkite.com/v2/organizations/casey-1/clusters/$cluster_id/secrets" > /tmp/secret-result.json
          fi

          fileboss_sha="$(git ls-remote https://github.com/GlacierEQ/FILEBOSS.git refs/heads/main | awk '{print $1}')"
          if [[ -z "$fileboss_sha" ]]; then
            fileboss_sha="HEAD"
          fi
          python3 - "$fileboss_sha" <<'PY' > /tmp/build.json
          import json, sys
          sha=sys.argv[1]
          print(json.dumps({
            "commit": sha,
            "branch": "main",
            "message": "APEX: run FILEBOSS full-corpus evidence transcription",
            "env": {
              "APEX_EXECUTION_SURFACE":"buildkite",
              "APEX_BOOTSTRAP_SOURCE":"job-app-helix"
            },
            "meta_data": {
              "apex_mission":"full-corpus-evidence-transcription",
              "source_repository":"GlacierEQ/FILEBOSS"
            }
          }))
          PY

          curl -fsS "${auth[@]}" -X POST --data-binary @/tmp/build.json "https://api.buildkite.com/v2/organizations/casey-1/pipelines/$slug/builds" > /tmp/build-result.json

          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/fileboss-pipeline.json'))
          b=json.load(open('/tmp/build-result.json'))
          out={
            "schema":"apex.fileboss.helix-buildkite-bootstrap.v1",
            "status":"BUILD_TRIGGERED",
            "organization":"casey-1",
            "pipeline":{
              "slug":p.get("slug"),
              "id":p.get("id"),
              "cluster_id":p.get("cluster_id"),
              "repository":p.get("repository"),
              "web_url":p.get("web_url")
            },
            "build":{
              "number":b.get("number"),
              "id":b.get("id"),
              "state":b.get("state"),
              "branch":b.get("branch"),
              "commit":b.get("commit"),
              "web_url":b.get("web_url")
            },
            "secrets":{"values_exposed":False}
          }
          assert out["build"]["number"], out
          print(json.dumps(out, indent=2))
          open('/tmp/fileboss-buildkite-bootstrap.json','w').write(json.dumps(out, indent=2)+'\n')
          PY

      - name: Upload non-secret bootstrap receipt
        uses: actions/upload-artifact@v4
        with:
          name: fileboss-buildkite-bootstrap
          path: /tmp/fileboss-buildkite-bootstrap.json
          if-no-files-found: error
          retention-days: 30
