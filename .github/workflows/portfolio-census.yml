name: Historical portfolio census

on:
  push:
    branches:
      - audit/proof-weighted-portfolio-2026-07-29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    name: "Census · ${{ matrix.repository }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        repository:
          - GlacierEQ/job-app-helix
          - GlacierEQ/AEON-777
          - GlacierEQ/AKOS
          - GlacierEQ/GlacierEQ_Swarm
          - GlacierEQ/Pro-comet-agent
          - GlacierEQ/anthropic-agent-coordinator
          - GlacierEQ/anthropic-safety-monitor
          - GlacierEQ/apex-cli
          - GlacierEQ/apex-control-plane
          - GlacierEQ/apple-ane-kv-quantizer
          - GlacierEQ/aws-trainium-neuron-sentinel
          - GlacierEQ/colossus-gateway
          - GlacierEQ/colossus-training-flux
          - GlacierEQ/comet-browser-agent-bridge
          - GlacierEQ/deepmind-tpu-mesh-optimizer
          - GlacierEQ/deepseek-mla-moe-sentinel
          - GlacierEQ/glaciereq-mcp-stack
          - GlacierEQ/grokodile
          - GlacierEQ/infinity-gauntlet-mcp-stack
          - GlacierEQ/job-application
          - GlacierEQ/kimi-mooncake-kv-stream
          - GlacierEQ/lovable-design-app-synth
          - GlacierEQ/manus-autonomous-web-agent
          - GlacierEQ/mastermind
          - GlacierEQ/meta-llama-collective-sentinel
          - GlacierEQ/microsoft-azure-ops
          - GlacierEQ/microsoft-identity-zero-trust
          - GlacierEQ/notion-mcp-empowerment-engine
          - GlacierEQ/notion-workflow-intelligence
          - GlacierEQ/notion-workspace-optimizer
          - GlacierEQ/nvidia-deep-reasoning
          - GlacierEQ/nvidia-gpu-health
          - GlacierEQ/openai-reasoning-kv-sentinel
          - GlacierEQ/openclaw
          - GlacierEQ/opera-neon-spatial-workspace
          - GlacierEQ/polyglot-systems-architecture
          - GlacierEQ/pro-code
          - GlacierEQ/qwen-vl-flash-router
          - GlacierEQ/robotics-vla-torque-sentinel
          - GlacierEQ/spacex-autonomy
          - GlacierEQ/spacex-conjunction-sentinel
          - GlacierEQ/spacex-cryogenics
          - GlacierEQ/spacex-ground-network
          - GlacierEQ/spacex-launch-sequencer
          - GlacierEQ/spacex-mission-control
          - GlacierEQ/spacex-orbital-mechanics
          - GlacierEQ/spacex-pad-weather-gate
          - GlacierEQ/spacex-propulsion-monitor
          - GlacierEQ/spacex-satellite-mesh
          - GlacierEQ/spacex-telemetry
          - GlacierEQ/spacex-thermal-protection
          - GlacierEQ/spiral-engine
          - GlacierEQ/tasklet-micro-agent-engine
          - GlacierEQ/tesla-fsd-occupancy-stream
          - GlacierEQ/the-tower-of-babel
          - GlacierEQ/token_saver
          - GlacierEQ/xai-colossus-2
          - GlacierEQ/xai-colossus-cooling
          - GlacierEQ/xai-colossus-cooling-alpha
          - GlacierEQ/xai-colossus-cooling-omega
          - GlacierEQ/xai-colossus-energy
          - GlacierEQ/xai-colossus-energy-alpha
          - GlacierEQ/xai-colossus-energy-omega
          - GlacierEQ/xai-colossus-nanosphere
          - GlacierEQ/xai-colossus-security
          - GlacierEQ/xai-colossus-servers
    steps:
      - name: Check out audit engine
        uses: actions/checkout@v4
        with:
          repository: GlacierEQ/job-app-helix
          ref: audit/proof-weighted-portfolio-2026-07-29
          path: audit

      - name: Capture GitHub repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        shell: bash
        run: |
          set +e
          gh api "repos/${TARGET_REPOSITORY}" \
            --jq '{fork, archived, private, visibility, default_branch, size, language, created_at, pushed_at, html_url, parent: (.parent.full_name // null), source: (.source.full_name // null)}' \
            > repo-metadata.json
          code=$?
          if [[ "$code" -ne 0 ]]; then
            printf '{"metadata_error":"GitHub metadata unavailable","private":true}\n' > repo-metadata.json
          fi

      - name: Check out target repository
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install safe audit dependency
        run: python -m pip install --upgrade pytest

      - name: Run proof-weighted census
        if: steps.checkout.outcome == 'success'
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
        shell: bash
        run: |
          slug="${TARGET_REPOSITORY#*/}"
          python audit/scripts/proof_weighted_repo_census.py \
            --repo "$TARGET_REPOSITORY" \
            --path target \
            --metadata repo-metadata.json \
            --output "census-${slug}.json"

      - name: Record inaccessible repository
        if: steps.checkout.outcome != 'success'
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
        shell: bash
        run: |
          slug="${TARGET_REPOSITORY#*/}"
          python - "$TARGET_REPOSITORY" "census-${slug}.json" <<'PY'
          import json, pathlib, sys
          payload = {
              "schema": "glaciereq.portfolio.audit.v1",
              "repository": sys.argv[1],
              "admission_class": "private_or_inaccessible_excluded",
              "structure": None,
              "readme": None,
              "verification": {"python": {"status": "BLOCKED_ACCESS"}},
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload census receipt
        uses: actions/upload-artifact@v4
        with:
          name: census-${{ strategy.job-index }}
          path: |
            census-*.json
            repo-metadata.json
          if-no-files-found: error
