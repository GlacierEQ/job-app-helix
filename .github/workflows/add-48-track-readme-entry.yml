name: Add 48-Track README Entry

on:
  push:
    branches:
      - hard-reset/48-track-diamond-gatling-2026-08-05
    paths:
      - .github/workflows/add-48-track-readme-entry.yml

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hard-reset/48-track-diamond-gatling-2026-08-05
          fetch-depth: 0

      - name: Insert the company-intelligence front door
        shell: bash
        env:
          SECTION_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          marker = "### What is already real\n"
          heading = "### 48-track company intelligence\n"
          section = base64.b64decode(os.environ["SECTION_B64"]).decode("utf-8")
          if heading not in text:
              if marker not in text:
                  raise SystemExit("README insertion marker is missing")
              path.write_text(text.replace(marker, section + marker, 1), encoding="utf-8")
          PY

      - name: Commit entry and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/add-48-track-readme-entry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/add-48-track-readme-entry.yml
          git diff --cached --check
          git commit -m 'docs: expose the 48-track intelligence plane'
          git push origin HEAD:hard-reset/48-track-diamond-gatling-2026-08-05
