name: Target Intelligence Cycle Proof

on:
  pull_request:
    paths:
      - "src/job_app_helix/target_intelligence_cycle.py"
      - "src/job_app_helix/target_opening_discovery.py"
      - "src/job_app_helix/opening_watch_cycle.py"
      - "src/job_app_helix/intelligence_cycle.py"
      - "tests/test_target_intelligence_cycle.py"
      - "tests/test_target_opening_discovery.py"
      - "tests/test_opening_watch_cycle.py"
      - "pyproject.toml"
      - ".github/workflows/target-intelligence-cycle-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/job_app_helix/target_intelligence_cycle.py"
      - "src/job_app_helix/target_opening_discovery.py"
      - "src/job_app_helix/opening_watch_cycle.py"
      - "src/job_app_helix/intelligence_cycle.py"
      - "tests/test_target_intelligence_cycle.py"
      - "tests/test_target_opening_discovery.py"
      - "tests/test_opening_watch_cycle.py"
      - "pyproject.toml"
      - ".github/workflows/target-intelligence-cycle-proof.yml"

permissions:
  contents: read

jobs:
  target-intelligence-cycle:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and proof tools
        run: python -m pip install -e '.[dev]'

      - name: Lint vertical target intelligence surface
        run: >-
          ruff check
          src/job_app_helix/target_intelligence_cycle.py
          tests/test_target_intelligence_cycle.py

      - name: Run adversarial vertical-cycle tests
        run: >-
          python -m pytest -q
          tests/test_target_intelligence_cycle.py
          tests/test_target_opening_discovery.py
          tests/test_opening_watch_cycle.py

      - name: Prove installed executable
        run: job-app-helix-target-cycle --help
