name: One-shot Aug 15 trajectory capture

on:
  push:
    branches:
      - trajectory-captures-2026
    paths:
      - .github/workflows/trajectory-capture-now.yml

permissions:
  contents: write

concurrency:
  group: trajectory-lattice-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out preservation branch
        uses: actions/checkout@v6
        with:
          ref: trajectory-captures-2026
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require private estate authority
        env:
          ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ESTATE_TOKEN:-}" ]; then
            echo "GLACIEREQ_ESTATE_TOKEN is required; refusing a partial public-only checkpoint." >&2
            exit 1
          fi

      - name: Merge canonical main without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Verify trajectory contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q tests/test_trajectory_lattice.py

      - name: Capture authenticated Aug 15 estate state
        env:
          GLACIEREQ_ESTATE_TOKEN: ${{ secrets.GLACIEREQ_ESTATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output="machine/trajectory/checkpoints/2026-08-15.json"
          args=(--date "2026-08-15" --output "${output}")
          if [ -f "machine/trajectory/checkpoints/2026-08-10.json" ]; then
            args+=(--previous "machine/trajectory/checkpoints/2026-08-10.json")
          fi
          python scripts/capture_trajectory_checkpoint.py "${args[@]}"
          python -m json.tool "${output}" >/dev/null

      - name: Preserve durable human-readable snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p machine/trajectory/artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path("machine/trajectory/checkpoints/2026-08-15.json")
          data = json.loads(src.read_text(encoding="utf-8"))
          inv = data["state"]["repository_inventory"]
          heads = data["state"]["canonical_heads"]
          dims = data["state"]["dimensions"]
          delta = data["delta"]
          receipt = data["receipt"]["checkpoint_sha256"]
          lines = [
              "# GlacierEQ Estate Trajectory Snapshot — 2026-08-15 HST",
              "",
              f"- Captured at: `{data['captured_at_hst']}`",
              f"- Phase: `{data['phase']}`",
              f"- Capture kind: `{data['capture_kind']}`",
              f"- Owned repositories: **{inv['owned_repository_count']}**",
              f"- Visibility: `{json.dumps(inv['visibility_counts'], sort_keys=True)}`",
              f"- Active / archived: **{inv['active_count']} / {inv['archived_count']}**",
              f"- Native / forks: **{inv['native_count']} / {inv['fork_count']}**",
              f"- Exact default-branch head records: **{len(heads)}**",
              f"- Dimension surfaces hashed: **{len(dims)}**",
              f"- Delta status from expected 2026-08-10 checkpoint: `{delta['status']}`",
              f"- Checkpoint canonical-body SHA-256 receipt: `{receipt}`",
              "",
              "The machine-readable checkpoint at `machine/trajectory/checkpoints/2026-08-15.json` is the controlling snapshot. This artifact is a durable human-readable projection and does not replace source truth.",
              "",
          ]
          Path("machine/trajectory/artifacts/2026-08-15-estate-snapshot.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Commit preservation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add machine/trajectory/checkpoints/2026-08-15.json machine/trajectory/artifacts/2026-08-15-estate-snapshot.md
          git commit -m "chore(trajectory): capture 2026-08-15 HST estate state"
          git push origin HEAD:trajectory-captures-2026

      - name: Upload immutable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-checkpoint-2026-08-15-${{ github.run_id }}
          path: |
            machine/trajectory/checkpoints/2026-08-15.json
            machine/trajectory/artifacts/2026-08-15-estate-snapshot.md
          if-no-files-found: error
          retention-days: 90
