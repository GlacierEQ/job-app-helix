name: Fix 48-Track README Command

on:
  push:
    branches:
      - hard-reset/48-track-diamond-gatling-2026-08-05
    paths:
      - .github/workflows/fix-48-track-readme-command.yml

permissions:
  contents: write

jobs:
  fix-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hard-reset/48-track-diamond-gatling-2026-08-05
          fetch-depth: 0
      - name: Correct command and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'python scripts/validate_company_inteligence.py'
          new = 'python scripts/validate_company_intelligence.py'
          if old not in text:
              raise SystemExit('expected README typo is absent')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-48-track-readme-command.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/fix-48-track-readme-command.yml
          git diff --cached --check
          git commit -m 'docs: correct company intelligence command'
          git push origin HEAD:hard-reset/48-track-diamond-gatling-2026-08-05
