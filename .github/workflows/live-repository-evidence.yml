name: Live Repository Evidence Adapter

on:
  push:
    branches: [main]
    paths:
      - "manifests/live_evidence_adapter_policy.json"
      - "schemas/repository_observation.schema.json"
      - "src/job_app_helix/live_evidence_adapter.py"
      - "scripts/compile_live_repository_evidence.py"
      - "tests/test_live_evidence_adapter.py"
      - "observations/repositories/**"
      - "docs/LIVE_REPOSITORY_EVIDENCE_ADAPTER.md"
      - ".github/workflows/live-repository-evidence.yml"
  pull_request:
    paths:
      - "manifests/live_evidence_adapter_policy.json"
      - "schemas/repository_observation.schema.json"
      - "src/job_app_helix/live_evidence_adapter.py"
      - "scripts/compile_live_repository_evidence.py"
      - "tests/test_live_evidence_adapter.py"
      - "observations/repositories/**"
      - "docs/LIVE_REPOSITORY_EVIDENCE_ADAPTER.md"
      - ".github/workflows/live-repository-evidence.yml"

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install package and verification tools
        run: python -m pip install -e ".[dev]"

      - name: Compile adapter surfaces
        run: >-
          python -m compileall -q
          src/job_app_helix/live_evidence_adapter.py
          scripts/compile_live_repository_evidence.py
          tests/test_live_evidence_adapter.py

      - name: Lint adapter surfaces
        run: >-
          ruff check
          src/job_app_helix/live_evidence_adapter.py
          scripts/compile_live_repository_evidence.py
          tests/test_live_evidence_adapter.py

      - name: Run adapter and health regressions
        run: >-
          python -m pytest -q
          tests/test_live_evidence_adapter.py
          tests/test_repository_health.py

      - name: Compile the current AKOS observation
        run: |
          python scripts/compile_live_repository_evidence.py \
            observations/repositories/GlacierEQ__AKOS__1607c0d27897ea963eb572062300342f1922b84c.json \
            --output /tmp/akos-live-assessment.json \
            --require-state PARTIALLY_VERIFIED

      - name: Verify the fail-closed AKOS boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/akos-live-assessment.json').read_text())
          assessment = result['assessment']
          assert result['repository'] == 'GlacierEQ/AKOS'
          assert result['observed_head_sha'] == '1607c0d27897ea963eb572062300342f1922b84c'
          assert assessment['health_state'] == 'PARTIALLY_VERIFIED'
          assert assessment['elite_eligible'] is False
          assert assessment['dimensions']['build']['state'] == 'UNVERIFIED'
          assert assessment['dimensions']['tests']['state'] == 'UNVERIFIED'
          assert assessment['dimensions']['security']['state'] == 'UNVERIFIED'
          assert assessment['quality_context']['connector_quality_score'] == 75
          assert assessment['quality_context']['data_quality_score'] == 85
          assert len(assessment['blockers']) == 2
          print(result['observation_id'])
          print(assessment['assessment_id'])
          PY

      - name: Upload generated assessment receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: akos-live-repository-assessment
          path: /tmp/akos-live-assessment.json
          if-no-files-found: error
